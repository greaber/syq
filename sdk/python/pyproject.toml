[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "syq"
version = "0.7.1"
description = "Official client for the syq file transfer tool"
readme = "README-PYTHON.md"
requires-python = ">=3.13.4"
license = "MIT"
license-files = ["LICENSE-PYTHON"]
authors = [
    { name = "Grant Reaber" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Filesystems",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/greaber/syq"
Repository = "https://github.com/greaber/syq"
Issues = "https://github.com/greaber/syq/issues"

[dependency-groups]
dev = [
    "build==1.3.0",
    "maturin==1.15.0",
    "pyyaml==6.0.3",
]

[tool.maturin]
bindings = "bin"
manifest-path = "../../Cargo.toml"
python-source = "src"
python-packages = ["syq"]
locked = true
editable-profile = "dev"
include = [
    { path = "NATIVE_API.md", format = "sdist" },
    { path = "native-api.json", format = "sdist" },
    { path = ".cargo_vcs_info.json", format = "sdist" },
]

[tool.uv]
required-version = "==0.11.6"
