[package]
name = "rsb-syq"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false

[dependencies]
anyhow = "=1.0.102"
arrow-array = "=59.2.0"
arrow-schema = "=59.2.0"
clap = { version = "=4.6.1", features = ["derive"] }
filetime = "=0.2.29"
libc = "=0.2.183"
parquet = { version = "=59.2.0", default-features = false, features = ["arrow", "snap", "zstd", "flate2-zlib-rs", "lz4"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
signal-hook = "=0.4.4"
tar = "=0.4.46"
tempfile = "=3.27.0"
walkdir = "=2.5.0"
