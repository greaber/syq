[package]
name = "syq"
version = "0.7.1"
edition = "2021"
rust-version = "1.94"
description = "Parallel file copy with an explicit native CLI and rsync compatibility"
license = "MIT"
repository = "https://github.com/greaber/syq"
readme = "README.md"
publish = ["crates-io"]
keywords = ["copy", "rsync", "ssh", "parallel", "transfer"]
categories = ["command-line-utilities", "filesystem"]
include = [
    "/build.rs",
    "/src/**",
    "/schemas/**",
    "/tests/**",
    "!/tests/tooling/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/docs/**",
    "/LICENSE",
]

[dependencies]
bytes = "1"
http-body = "1"
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client", "credentials-process", "sso"] }
aws-runtime = { version = "1", default-features = false }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-smithy-http-client = { version = "1", features = ["rustls-aws-lc"] }
aws-smithy-runtime = { version = "1", default-features = false, features = ["client"] }
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-smithy-types = "1"
aws-types = "1"
aws-credential-types = "1"
aws-sigv4 = { version = "1", default-features = false, features = ["sign-http", "http1"] }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync", "time", "signal", "macros"] }
futures-util = "0.3"
http = "1"
url = "2"
percent-encoding = "2"
socket2 = "0.6"
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc", "use-std"] }
jwalk = "0.9"
rayon = "1.12"
ignore = "0.4"
globset = "0.4"
regex = "1"
time = { version = "0.3", features = ["parsing"] }
blake3 = "1"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
zstd = "0.14"
libc = "0.2"
shell-words = "1"
serde_bytes = "0.11"
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["non-fips", "alloc"] }
getrandom = "0.4"
hpke = { version = "0.14", default-features = false, features = ["alloc", "getrandom", "chacha", "x25519"] }
zeroize = "1"
serde_json = "1"
serde_json_canonicalizer = "0.3"
base64 = { version = "0.23", default-features = false, features = ["std"] }
ed25519-dalek = "3"
flate2 = "1"
semver = "1"
sha2 = "0.11"
md-5 = "0.11"
ureq = { version = "3", default-features = false, features = ["rustls"] }
ssh-agent-lib = { version = "0.6", default-features = false }
ssh-key = { version = "0.6.7", features = ["ed25519", "p256", "p384", "p521", "rsa"] }
tempfile = "3"
signature = "2"
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
sha2-compat = { package = "sha2", version = "0.10" }
subtle = "2.6.1"
signal-hook = "0.4.4"
lz4 = "1.28.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[build-dependencies]
cc = "1"
serde_json = "1"

# Keep CPU-heavy copies practical in development and test builds.
[profile.dev]
opt-level = 1
# Debug information makes the binary several times larger and slows tests
# that copy, hash, or install it. Panic messages keep their file and line.
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 0
strip = "symbols"

# Published executables: whole-program optimization makes them smaller, at the
# cost of a slower final link than ordinary release builds need.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[dev-dependencies]
cc = "1"
tokio = { version = "1", features = ["test-util"] }
libc = "0.2"
serde_json = "1"
jsonschema = { version = "0.57", default-features = false }

# BLAKE3 uses C/NEON on ARM, unlike the x86 assembly backend. Keep it
# optimized in debug/test builds so hashing does not dominate race-test waits.
[profile.dev.package.blake3]
opt-level = 3

[lints.clippy]
# Receiver modules opt into the subprocess restrictions in clippy.toml.
disallowed_methods = "allow"
