[package]
name = "syq"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Parallel copy with an rsync-shaped interface"
license = "MIT"
repository = "https://github.com/greaber/syq"
readme = "README.md"
keywords = ["copy", "rsync", "ssh", "parallel", "transfer"]
categories = ["command-line-utilities", "filesystem"]
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc", "use-std"] }
jwalk = "0.8"
ignore = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.13"
libc = "0.2"
shell-words = "1"
serde_bytes = "0.11"
aes-gcm = "0.10"
getrandom = "0.2"
serde_json = "1"
base64 = "0.22"
ed25519-dalek = "3"
flate2 = "1"
semver = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1
strip = "symbols"

[dev-dependencies]
libc = "0.2"
