[package]
name = "pcp"
version = "0.1.0"
edition = "2021"
description = "Parallel copy with an rsync-shaped interface"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc", "use-std"] }
jwalk = "0.8"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.13"
libc = "0.2"
shell-words = "1"
serde_bytes = "0.11"
aes-gcm = "0.10"
getrandom = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1

[dev-dependencies]
libc = "0.2"
