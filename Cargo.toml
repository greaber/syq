[package]
name = "syq"
version = "0.1.3"
edition = "2021"
rust-version = "1.94"
description = "Parallel copy with an rsync-shaped interface"
license = "MIT"
repository = "https://github.com/greaber/syq"
readme = "README.md"
keywords = ["copy", "rsync", "ssh", "parallel", "transfer"]
categories = ["command-line-utilities", "filesystem"]
include = [
    "/build.rs",
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc", "use-std"] }
jwalk = "0.9"
ignore = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.13"
libc = "0.2"
shell-words = "1"
serde_bytes = "0.11"
aes-gcm = "0.11"
getrandom = "0.4"
serde_json = "1"
serde_json_canonicalizer = "0.3"
base64 = { version = "0.23", default-features = false, features = ["std"] }
ed25519-dalek = "3"
flate2 = "1"
semver = "1"
sha2 = "0.11"
ureq = { version = "3", default-features = false, features = ["rustls"] }
ssh-agent-lib = { version = "0.6", default-features = false }
ssh-key = { version = "0.6.7", features = ["ed25519", "p256", "p384", "p521", "rsa"] }
tempfile = "3"
signature = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1
strip = "symbols"

[dev-dependencies]
libc = "0.2"
