# Enforced in macOS receiver modules by src/main.rs. A new process launch
# there needs a descriptor-inheritance design before it can pass Clippy.
disallowed-methods = [
    "std::process::Command::new",
    "syq::process::CommandExt::spawn_guarded",
    "syq::process::CommandExt::status_guarded",
    "syq::process::CommandExt::capture_output",
    "std::process::Command::spawn",
    "std::process::Command::output",
    "std::process::Command::status",
    "std::os::unix::process::CommandExt::exec",
    "libc::fork",
    "libc::posix_spawn",
    "libc::posix_spawnp",
    "libc::system",
    "libc::popen",
    "libc::execve",
    "libc::execv",
    "libc::execvp",
]

# Denied outside tests by src/main.rs. These panic when stderr or stdout is
# closed, as under `2>&1 | head`: a panicking transfer thread can leave a copy
# unfinished, and a command ends with a panic instead of its own status.
# crate::output drops output it cannot write.
disallowed-macros = [
    { path = "std::eprint", reason = "panics when stderr is closed; use crate::output::diagnostic!" },
    { path = "std::eprintln", reason = "panics when stderr is closed; use crate::output::diagnostic!" },
    { path = "std::print", reason = "panics when stdout is closed; use crate::output::command_print! or human_stdout!" },
    { path = "std::println", reason = "panics when stdout is closed; use crate::output::command_println! or human_stdout!" },
]
