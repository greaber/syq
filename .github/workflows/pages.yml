name: pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'sdk/README.md'
      - 'sdk/python/README-PYTHON.md'
      - 'sdk/python/NATIVE_API.md'
      - 'theme/**'
      - 'book.toml'
      - 'scripts/check-doc-links.py'
      - 'scripts/build-doc-site.py'
      - 'scripts/test-doc-site.py'
      - 'scripts/test-doc-selector.cjs'
      - '.github/workflows/pages.yml'
  # GITHUB_TOKEN publication does not emit a usable release event. Refresh even
  # if a later package/tap step failed: the GitHub release may already be public.
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A completed release must not replace development docs with the tag tree.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'master' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Cache pinned development tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/syq-tools
          key: pinned-tools-${{ runner.os }}-${{ runner.arch }}-pages-${{ hashFiles('scripts/setup.lock', 'scripts/setup.sh') }}
      - name: Install pinned development tools
        env:
          SYQ_TOOLS_DIR: ${{ runner.temp }}/syq-tools
        run: scripts/setup.sh github python node mdbook
      - name: Check documentation links
        run: python3 scripts/check-doc-links.py
      - name: Test version selection
        run: |
          python3 scripts/test-doc-site.py
          node --test scripts/test-doc-selector.cjs
      - name: Build all documentation versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build-doc-site.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/doc-site

  deploy:
    # A manual task-branch run builds a review artifact without publishing it.
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
