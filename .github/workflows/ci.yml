name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add rustfmt clippy
      - name: Check dependency policy
        env:
          CARGO_DENY_VERSION: 0.20.2
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-deny.tar.gz"
          directory="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --proto '=https' \
            --proto-redir '=https' --output "$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$directory.tar.gz"
          printf '%s  %s\n' "$CARGO_DENY_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/$directory/cargo-deny" --version)" = \
            "cargo-deny $CARGO_DENY_VERSION"
          "$RUNNER_TEMP/$directory/cargo-deny" --locked check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - run: scripts/test-cargo-package.sh
      - run: scripts/test-installer.sh
      - run: scripts/test-release-tools.sh
      - run: scripts/test-secret-tools.sh
      - run: shellcheck scripts/package-release.sh scripts/generate-installer.sh scripts/generate-homebrew-formula.sh scripts/sign-release-manifest.sh scripts/verify-release-tag.sh scripts/verify-release-assets.sh scripts/verify-crates-io-package.sh scripts/init-release-secrets.sh scripts/sync-github-secrets.sh scripts/test-cargo-package.sh scripts/test-installer.sh scripts/test-release-tools.sh scripts/test-homebrew-formula.sh scripts/test-secret-tools.sh

  sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install pinned Python tooling
        run: python -m pip install --disable-pip-version-check --no-deps uv==0.11.6
      - name: Test and package Python SDK
        env:
          PYTHONPATH: sdk/python/src
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/syq-sdk-python
        run: |
          uv run --project sdk/python --frozen python -m unittest discover -s sdk/python/tests
          uv run --project sdk/python --frozen python -m build sdk/python --outdir target/sdk-python-dist
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          package-manager-cache: false
      - name: Test and package JavaScript SDK
        working-directory: sdk/js
        run: |
          npm ci --ignore-scripts
          npm test
          npm pack --dry-run
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false
      - name: Format, vet, and test Go SDK
        working-directory: sdk/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

  # The release workflow builds on this runner; libc field types differ from
  # x86-64 (st_nlink is u32 here), so check it before a tag can fail.
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo check --locked --all-targets

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo check --locked --all-targets
      - run: scripts/test-installer.sh
      - run: scripts/test-homebrew-formula.sh
