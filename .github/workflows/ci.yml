name: ci

on:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      linux_trial:
        description: Run only Linux on this provider (disabled keeps normal CI on Namespace)
        type: choice
        default: disabled
        options:
          - disabled
          - github
          - namespace
      documentation_only:
        description: Run only executable documentation tests
        required: false
        default: false
        type: boolean
      scope_commit:
        description: Commit whose diff determines the selected checks
        required: false
        type: string
      suites:
        description: >-
          Run only these suites on a task branch (space-separated; see SUITES in
          scripts/ci-scope.py). A later run of the same suite on the branch
          cancels this one.
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.changes.outputs.native }}
      sdks: ${{ steps.changes.outputs.sdks }}
      sdk_matrix: ${{ steps.changes.outputs.sdk_matrix }}
      python_sdk: ${{ steps.changes.outputs.python_sdk }}
      tooling: ${{ steps.changes.outputs.tooling }}
      tooling_checks: ${{ steps.changes.outputs.tooling_checks }}
      shellcheck: ${{ steps.changes.outputs.shellcheck }}
      mapping_docs: ${{ steps.changes.outputs.mapping_docs }}
      macos: ${{ steps.changes.outputs.macos }}
      linux_arm64: ${{ steps.changes.outputs.linux_arm64 }}
      full_suite: ${{ steps.changes.outputs.full_suite }}
      integration_targets: ${{ steps.changes.outputs.integration_targets }}
      suite_selection: ${{ steps.changes.outputs.suite_selection }}
      rust_suites: ${{ steps.changes.outputs.rust_suites }}
      all_tooling: ${{ steps.changes.outputs.all_tooling }}
      s3: ${{ steps.changes.outputs.s3 }}
      repository_checks: ${{ steps.changes.outputs.repository_checks }}
      macos_intel: ${{ steps.changes.outputs.macos_intel }}
      real_ssh_matrix: ${{ steps.changes.outputs.real_ssh_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cache pinned development tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/syq-tools
          key: pinned-tools-${{ runner.os }}-${{ runner.arch }}-jq-python-${{ hashFiles('scripts/setup.lock', 'scripts/setup.sh') }}
      - name: Install pinned development tools
        env:
          SYQ_TOOLS_DIR: ${{ runner.temp }}/syq-tools
        run: scripts/setup.sh github jq python
      - name: Classify changed paths
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          SYQ_CI_DOCUMENTATION_ONLY: ${{ inputs.documentation_only }}
          SYQ_CI_SCOPE_COMMIT: ${{ inputs.scope_commit }}
          SYQ_CI_SUITES: ${{ inputs.suites }}
        run: scripts/ci-scope.py "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"

  rust:
    # Release checks require the name `rust`; selected suites never run on master.
    name: ${{ needs.scope.outputs.suite_selection == 'true' && format('rust ({0})', needs.scope.outputs.rust_suites) || 'rust' }}
    # Cancel only matching automatic checks and later selections of the same
    # suite on the same branch; other manual runs keep a unique group.
    concurrency:
      # Full native suites already include tooling, shell lint, and mapping tests.
      group: ${{ github.workflow }}-rust-${{ github.event_name == 'push' && github.ref || needs.scope.outputs.suite_selection == 'true' && format('{0}-selected', github.ref) || github.run_id }}-${{ needs.scope.result }}-${{ needs.scope.outputs.integration_targets }}-${{ needs.scope.outputs.tooling_checks }}-${{ needs.scope.outputs.native == 'true' && needs.scope.outputs.full_suite == 'true' && 'full' || format('{0}-{1}-{2}-{3}-{4}', needs.scope.outputs.native, needs.scope.outputs.tooling, needs.scope.outputs.shellcheck, needs.scope.outputs.mapping_docs, needs.scope.outputs.full_suite) }}
      cancel-in-progress: ${{ github.event_name == 'push' || needs.scope.outputs.suite_selection == 'true' }}
    needs: scope
    # Selected suites skip unselected jobs instead of recording stub successes.
    if: >-
      always() &&
      (needs.scope.outputs.suite_selection != 'true' ||
       needs.scope.outputs.native == 'true' ||
       needs.scope.outputs.tooling == 'true' ||
       needs.scope.outputs.shellcheck == 'true' ||
       needs.scope.outputs.mapping_docs == 'true')
    runs-on: ${{ inputs.linux_trial != 'github' && format('namespace-profile-syq-linux;github.run-id={0}', github.run_id) || 'ubuntu-24.04' }}
    steps:
      - name: Require successful path classification
        if: needs.scope.result != 'success'
        run: echo 'Path classification failed.' >&2; exit 1
      - name: Complete the required check when Rust and tooling are unaffected
        if: >-
          needs.scope.outputs.native != 'true' &&
          needs.scope.outputs.tooling != 'true' &&
          needs.scope.outputs.shellcheck != 'true' &&
          needs.scope.outputs.mapping_docs != 'true'
        run: echo 'Rust, executable documentation, and repository tooling are unaffected.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: >-
          needs.scope.outputs.native == 'true' ||
          needs.scope.outputs.tooling == 'true' ||
          needs.scope.outputs.shellcheck == 'true' ||
          needs.scope.outputs.mapping_docs == 'true'
        with:
          persist-credentials: false
      - name: Cache pinned development tools
        if: >-
          needs.scope.outputs.native == 'true' ||
          needs.scope.outputs.tooling == 'true' ||
          needs.scope.outputs.shellcheck == 'true' ||
          needs.scope.outputs.mapping_docs == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/syq-tools
          key: pinned-tools-${{ runner.os }}-${{ runner.arch }}-shellcheck-jq-python${{ needs.scope.outputs.all_tooling == 'true' && '-node' || '' }}-${{ hashFiles('scripts/setup.lock', 'scripts/setup.sh') }}
      - name: Install pinned development tools
        if: >-
          needs.scope.outputs.native == 'true' ||
          needs.scope.outputs.tooling == 'true' ||
          needs.scope.outputs.shellcheck == 'true' ||
          needs.scope.outputs.mapping_docs == 'true'
        env:
          SYQ_TOOLS_DIR: ${{ runner.temp }}/syq-tools
        run: |
          scripts/setup.sh github shellcheck jq python
          if [[ "${{ needs.scope.outputs.all_tooling }}" == true ]]; then
            scripts/setup.sh github node
          fi
      - name: Show Linux trial hardware
        if: inputs.linux_trial == 'github' || inputs.linux_trial == 'namespace'
        run: |
          uname -a
          lscpu
          free -h
          df -h .
      - name: Attach Namespace Cargo cache
        if: inputs.linux_trial != 'github' && (needs.scope.outputs.native == 'true' || contains(format(' {0} ', needs.scope.outputs.tooling_checks), ' package ') || contains(format(' {0} ', needs.scope.outputs.tooling_checks), ' release ') || needs.scope.outputs.mapping_docs == 'true')
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
      - name: Cache Cargo dependencies and build output
        if: inputs.linux_trial == 'github' && (needs.scope.outputs.native == 'true' || contains(format(' {0} ', needs.scope.outputs.tooling_checks), ' package ') || contains(format(' {0} ', needs.scope.outputs.tooling_checks), ' release ') || needs.scope.outputs.mapping_docs == 'true')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ci-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-ci-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            cargo-ci-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            cargo-ci-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Install Rust check components
        if: needs.scope.outputs.native == 'true'
        run: rustup component add rustfmt clippy
      - name: Check dependency policy
        if: >-
          needs.scope.outputs.native == 'true' &&
          needs.scope.outputs.full_suite == 'true'
        env:
          CARGO_DENY_VERSION: 0.20.2
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-deny.tar.gz"
          directory="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --proto '=https' \
            --proto-redir '=https' --output "$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$directory.tar.gz"
          printf '%s  %s\n' "$CARGO_DENY_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/$directory/cargo-deny" --version)" = \
            "cargo-deny $CARGO_DENY_VERSION"
          "$RUNNER_TEMP/$directory/cargo-deny" --locked check
      - name: Check Rust formatting
        if: needs.scope.outputs.native == 'true'
        run: cargo fmt --all -- --check
      - name: Lint every Rust target
        if: needs.scope.outputs.native == 'true'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test native targets
        if: needs.scope.outputs.native == 'true'
        env:
          INTEGRATION_TARGETS: ${{ needs.scope.outputs.integration_targets }}
          FULL_SUITE: ${{ needs.scope.outputs.full_suite }}
          NAMESPACE_RUNNER: ${{ inputs.linux_trial != 'github' }}
        run: |
          if [[ "$NAMESPACE_RUNNER" == true ]]; then
            # The container's overlay filesystem has no stable filesystem ID.
            # Use the attached native volume for filesystem-sensitive fixtures.
            test_tmp=$(mktemp -d /cache/syq-tests.XXXXXX)
            trap 'rm -rf -- "$test_tmp"' EXIT
            export TMPDIR="$test_tmp"
            stat -f --format='Test filesystem: %T, ID: %i' "$TMPDIR"
          fi
          read -r -a integration_targets <<< "$INTEGRATION_TARGETS"
          if [[ "$FULL_SUITE" == true || " ${integration_targets[*]} " == *" all "* ]]; then
            cargo test --locked --all-targets
          else
            targets=(--bin syq)
            for target in "${integration_targets[@]}"; do
              targets+=(--test "$target")
            done
            cargo test --locked "${targets[@]}"
          fi
      - name: Test executable mapping documentation
        if: >-
          needs.scope.outputs.mapping_docs == 'true' &&
          (needs.scope.outputs.native != 'true' ||
           needs.scope.outputs.full_suite != 'true')
        run: cargo test --locked --test local _md_
      - name: Test every repository tooling script
        if: needs.scope.outputs.all_tooling == 'true'
        run: scripts/run-tooling-tests.py
      - name: Test Cargo package identity
        if: >-
          needs.scope.outputs.all_tooling != 'true' &&
          contains(format(' {0} ', needs.scope.outputs.tooling_checks), ' package ')
        run: tests/tooling/test-cargo-package.py
      - name: Test installer tooling
        if: >-
          needs.scope.outputs.all_tooling != 'true' &&
          contains(format(' {0} ', needs.scope.outputs.tooling_checks), ' installer ')
        run: tests/tooling/test-installer.py
      - name: Test interactive benchmark
        if: >-
          needs.scope.outputs.all_tooling != 'true' &&
          contains(format(' {0} ', needs.scope.outputs.tooling_checks), ' benchmark ')
        run: python3 tests/tooling/test-try-benchmark.py
      - name: Test release tooling
        if: >-
          needs.scope.outputs.all_tooling != 'true' &&
          contains(format(' {0} ', needs.scope.outputs.tooling_checks), ' release ')
        env:
          TOOLING_CHECKS: ${{ needs.scope.outputs.tooling_checks }}
        run: |
          if [[ " $TOOLING_CHECKS " == *" package "* ]]; then
            tests/tooling/test-release-tools.py --syq "$GITHUB_WORKSPACE/target/package-identity/debug/syq"
          else
            tests/tooling/test-release-tools.py
          fi
      - name: Test release orchestration
        if: >-
          needs.scope.outputs.all_tooling != 'true' &&
          contains(format(' {0} ', needs.scope.outputs.tooling_checks), ' orchestration ')
        run: |
          tests/tooling/test-release-orchestration.py
          tests/tooling/test-tooling.py
          python3 tests/tooling/test-tooling-discovery.py
          tests/tooling/test-generated-sdk-post-merge-ci.py
          tests/tooling/test-release-readiness.py
          tests/tooling/test-release-timings.py
          tests/tooling/test-find-release-build.py
      - name: Test focused check dispatch
        if: >-
          needs.scope.outputs.all_tooling != 'true' &&
          contains(format(' {0} ', needs.scope.outputs.tooling_checks), ' focused ')
        run: python3 tests/tooling/test-run-focused-check.py
      - name: Test branch status tooling
        if: >-
          needs.scope.outputs.all_tooling != 'true' &&
          contains(format(' {0} ', needs.scope.outputs.tooling_checks), ' branch ')
        run: tests/tooling/test-branch-status.py
      - name: Test the development setup
        if: >-
          needs.scope.outputs.all_tooling != 'true' &&
          contains(format(' {0} ', needs.scope.outputs.tooling_checks), ' setup ')
        run: tests/tooling/test-setup.sh
      - name: Validate workflow syntax and script references
        if: >-
          contains(format(' {0} ', needs.scope.outputs.tooling_checks), ' workflows ')
        run: |
          scripts/check-workflows.py
          scripts/check-script-references.py
      - name: Lint tracked shell scripts
        if: >-
          needs.scope.outputs.tooling == 'true' ||
          needs.scope.outputs.shellcheck == 'true' ||
          (needs.scope.outputs.native == 'true' &&
           needs.scope.outputs.full_suite == 'true')
        run: git ls-files -z -- '*.sh' | xargs -0 shellcheck

  sdk-languages:
    strategy:
      fail-fast: false
      matrix:
        sdk: ${{ fromJSON(needs.scope.outputs.sdk_matrix || '["none"]') }}
    # Cancel only matching automatic checks and later selections of the same
    # suite on the same branch; other manual runs keep a unique group.
    concurrency:
      group: ${{ github.workflow }}-sdks-${{ matrix.sdk }}-${{ github.event_name == 'push' && github.ref || needs.scope.outputs.suite_selection == 'true' && format('{0}-selected', github.ref) || github.run_id }}-${{ needs.scope.result }}-${{ needs.scope.outputs.python_sdk }}
      cancel-in-progress: ${{ github.event_name == 'push' || needs.scope.outputs.suite_selection == 'true' }}
    needs: scope
    if: >-
      always() && inputs.linux_trial != 'github' && inputs.linux_trial != 'namespace' &&
      (needs.scope.outputs.suite_selection != 'true' || needs.scope.outputs.python_sdk == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Require successful path classification
        if: needs.scope.result != 'success'
        run: echo 'Path classification failed.' >&2; exit 1
      - name: Complete the required check when SDKs are unaffected
        if: needs.scope.outputs[format('{0}_sdk', matrix.sdk)] != 'true'
        run: echo 'SDK validation is not needed for this change set.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scope.outputs[format('{0}_sdk', matrix.sdk)] == 'true'
        with:
          persist-credentials: false
      - name: Cache pinned development tools
        if: needs.scope.outputs[format('{0}_sdk', matrix.sdk)] == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/syq-tools
          key: pinned-tools-${{ runner.os }}-${{ runner.arch }}-${{ matrix.sdk }}-${{ hashFiles('scripts/setup.lock', 'scripts/setup.sh') }}
      - name: Install pinned development tools
        if: needs.scope.outputs[format('{0}_sdk', matrix.sdk)] == 'true'
        env:
          SYQ_TOOLS_DIR: ${{ runner.temp }}/syq-tools
        run: >-
          scripts/setup.sh github uv python jq
      - name: Cache Cargo dependencies and build output
        if: matrix.sdk == 'python' && needs.scope.outputs.python_sdk == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ci-sdks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-ci-sdks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            cargo-ci-sdks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            cargo-ci-sdks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Require the matching Python SDK for the latest syq release
        if: matrix.sdk == 'python' && needs.scope.outputs.python_sdk == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          pinned_tag=$(jq -er .tag sdk/python/src/syq/syq-release-manifest.json)
          test "$pinned_tag" = "$latest_tag" || {
            echo "Python SDK pins $pinned_tag, but the latest syq release is $latest_tag" >&2
            exit 1
          }
          pinned_version=${pinned_tag#v}
          python_version=$(sed -n 's/^version = "\(.*\)"/\1/p' \
            sdk/python/pyproject.toml)
          test "$python_version" = "$pinned_version" || {
            echo "Python SDK $python_version pins syq $pinned_version; versions must match" >&2
            exit 1
          }
      - name: Build the candidate syq executable
        if: matrix.sdk == 'python' && needs.scope.outputs.python_sdk == 'true'
        run: cargo build --locked --bin syq
      - name: Test and package Python SDK
        if: matrix.sdk == 'python' && needs.scope.outputs.python_sdk == 'true'
        env:
          PYTHONPATH: sdk/python/src
          SYQ_CANDIDATE_EXECUTABLE: ${{ github.workspace }}/target/debug/syq
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/syq-sdk-python
          XDG_CACHE_HOME: ${{ runner.temp }}/syq-sdk-cache
        run: |
          SYQ_CANDIDATE_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          export SYQ_CANDIDATE_VERSION
          tests/tooling/test-python-sdk-release-tools.py
          uv run --project sdk/python --frozen python -m unittest discover -s sdk/python/tests
          export SOURCE_DATE_EPOCH RUSTUP_TOOLCHAIN
          RUSTUP_TOOLCHAIN=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          output=target/sdk-python-dist
          # Restored Cargo caches can contain distributions from an older SDK.
          rm -rf -- "$output"
          MATURIN_PEP517_ARGS="--profile dev" uv run --project sdk/python --frozen python -m build sdk/python --sdist --wheel --outdir "$output"
          python scripts/normalize-python-sdist.py \
            --epoch "$SOURCE_DATE_EPOCH" "$output"/*.tar.gz
          set -- target/sdk-python-dist/syq-*-py3-none-*.whl
          test "$#" -eq 1 && test -f "$1"
          env -u PYTHONPATH uv run --isolated --python "$UV_PYTHON" \
            --with "$1" \
            python scripts/check-python-wheel.py --version "$SYQ_CANDIDATE_VERSION"
          rm -rf -- target/sdk-python-from-sdist
          # Rebuild syq from the archive, reusing only its compiled dependencies.
          # Archive mtimes can repeat across commits, so discard syq artifacts first.
          cargo clean --package syq --target-dir "$GITHUB_WORKSPACE/target"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
            MATURIN_PEP517_ARGS="--profile dev" uv build --wheel \
            target/sdk-python-dist/*.tar.gz --out-dir target/sdk-python-from-sdist
          set -- target/sdk-python-from-sdist/syq-*-py3-none-*.whl
          test "$#" -eq 1 && test -f "$1"
          env -u PYTHONPATH uv run --isolated --python "$UV_PYTHON" \
            --with "$1" \
            python scripts/check-python-wheel.py --version "$SYQ_CANDIDATE_VERSION"

  # Keep the public check name consumed by generated-SDK validation and release
  # preflight. A successful subset cannot hide a failed/cancelled matrix job.
  sdks:
    needs: [scope, sdk-languages]
    if: >-
      always() && inputs.linux_trial != 'github' && inputs.linux_trial != 'namespace' &&
      needs.scope.outputs.suite_selection != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require successful SDK validation
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SDK_RESULT: ${{ needs.sdk-languages.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$SDK_RESULT" = success

  # The release workflow builds on this runner; libc field types differ from
  # x86-64 (st_nlink is u32 here), so include it in full validation.
  linux-arm64:
    # Cancel only matching automatic checks and later selections of the same
    # suite on the same branch; other manual runs keep a unique group.
    concurrency:
      group: ${{ github.workflow }}-linux-arm64-${{ github.event_name == 'push' && github.ref || needs.scope.outputs.suite_selection == 'true' && format('{0}-selected', github.ref) || github.run_id }}-${{ needs.scope.result }}-${{ needs.scope.outputs.linux_arm64 }}
      cancel-in-progress: ${{ github.event_name == 'push' || needs.scope.outputs.suite_selection == 'true' }}
    needs: scope
    if: >-
      always() && inputs.linux_trial != 'github' && inputs.linux_trial != 'namespace' &&
      (needs.scope.outputs.suite_selection != 'true' || needs.scope.outputs.linux_arm64 == 'true')
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Require successful path classification
        if: needs.scope.result != 'success'
        run: echo 'Path classification failed.' >&2; exit 1
      - name: Complete the required check when ARM validation is deferred
        if: needs.scope.outputs.linux_arm64 != 'true'
        run: echo 'ARM validation is deferred to nightly or manual full validation.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scope.outputs.linux_arm64 == 'true'
        with:
          persist-credentials: false
      - name: Cache Cargo dependencies and build output
        if: needs.scope.outputs.linux_arm64 == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ci-linux-arm64-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-ci-linux-arm64-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            cargo-ci-linux-arm64-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            cargo-ci-linux-arm64-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      - if: needs.scope.outputs.linux_arm64 == 'true'
        run: cargo check --locked --all-targets
      # Release jobs install these on this platform; verify the pinned ARM
      # downloads without a cache so full and nightly runs catch a bad pin.
      - name: Install and check every pinned tool
        if: needs.scope.outputs.linux_arm64 == 'true'
        env:
          SYQ_TOOLS_DIR: ${{ runner.temp }}/syq-tools
        run: |
          set -euo pipefail
          scripts/setup.sh install
          eval "$(scripts/setup.sh env)"
          awk '!/^#/ && NF && !seen[$1]++ { print $1, $2 }' scripts/setup.lock |
            while read -r tool version; do
              command=$tool
              if [ "$tool" = python ]; then command=python3; fi
              location=$(command -v "$command")
              actual=$("$command" --version)
              echo "$tool $version: $location: $actual"
              case "$location" in "$SYQ_TOOLS_DIR"/*) ;; *) exit 1 ;; esac
              case "$actual" in *"$version"*) ;; *) exit 1 ;; esac
            done

  # An actual Intel runner catches host-architecture cfg and libc differences
  # before the release workflow builds its x86-64 artifact. Keep this on full
  # nightly and manual runs.
  macos_intel:
    # Cancel only matching automatic checks and later selections of the same
    # suite on the same branch; other manual runs keep a unique group.
    concurrency:
      group: ${{ github.workflow }}-macos_intel-${{ github.event_name == 'push' && github.ref || needs.scope.outputs.suite_selection == 'true' && format('{0}-selected', github.ref) || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'push' || needs.scope.outputs.suite_selection == 'true' }}
    needs: scope
    if: >-
      inputs.linux_trial != 'github' && inputs.linux_trial != 'namespace' &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.macos_intel == 'true'
    runs-on: macos-26-intel
    env:
      # This job checks compilation and updater behavior, not copy throughput.
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Cargo dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ci-macos_intel-fast-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-ci-macos_intel-fast-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            cargo-ci-macos_intel-fast-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            cargo-ci-macos_intel-fast-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      - run: cargo check --locked --all-targets
      - name: Exercise the Intel standalone-update artifact selection
        run: cargo test --locked --test update

  # Preserve the `macos` check for Intel. Apple Silicon is certified once by
  # the full macos.yml workflow, required separately by verify-release-ci.py.
  macos:
    needs: [scope, macos_intel]
    if: >-
      always() && needs.macos_intel.result != 'cancelled' &&
      inputs.linux_trial != 'github' && inputs.linux_trial != 'namespace' &&
      needs.scope.outputs.suite_selection != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require successful path classification
        if: needs.scope.result != 'success'
        run: echo 'Path classification failed.' >&2; exit 1
      - name: Complete the required check when macOS validation is unaffected
        if: needs.scope.outputs.macos != 'true'
        run: echo 'macOS validation is not needed for this change set.'
      - name: Require Intel validation in a full suite
        if: >-
          needs.scope.outputs.macos == 'true' &&
          needs.scope.outputs.full_suite == 'true' &&
          needs.macos_intel.result != 'success'
        run: echo 'Intel macOS validation failed or did not complete.' >&2; exit 1
      - name: Record successful macOS validation
        if: >-
          needs.scope.outputs.macos == 'true' &&
          (needs.scope.outputs.full_suite != 'true' ||
           needs.macos_intel.result == 'success')
        run: echo 'Required macOS validation succeeded.'

  # These suites need Docker, released binaries, Nix, or other setup that the
  # rust job does not have. They run in full nightly and manual suites, and
  # when selected on a task branch; the full-suite ci.yml run that certifies a
  # release includes them.
  object-storage:
    concurrency:
      group: ${{ github.workflow }}-object-storage-${{ needs.scope.outputs.suite_selection == 'true' && github.ref || github.run_id }}
      cancel-in-progress: ${{ needs.scope.outputs.suite_selection == 'true' }}
    needs: scope
    if: >-
      inputs.linux_trial != 'github' && inputs.linux_trial != 'namespace' &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.s3 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache pinned development tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/syq-tools
          key: pinned-tools-${{ runner.os }}-${{ runner.arch }}-python-${{ hashFiles('scripts/setup.lock', 'scripts/setup.sh') }}
      - name: Install pinned development tools
        env:
          SYQ_TOOLS_DIR: ${{ runner.temp }}/syq-tools
        run: scripts/setup.sh github python
      - name: Cache Cargo dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ci-object-storage-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-ci-object-storage-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            cargo-ci-object-storage-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Test against a disposable S3 server
        run: scripts/test-s3.py
      - name: Test the S3 suite runner and benchmark command policy
        if: ${{ !cancelled() }}
        run: |
          python3 tests/object-storage/test-runner.py
          python3 tests/object-storage/test_benchmark.py

  # The lab image is built once and shared by the parallel real-SSH jobs.
  # Only its dependency stage is cached; it changes with the lock file.
  real-ssh-lab:
    needs: scope
    if: >-
      inputs.linux_trial != 'github' && inputs.linux_trial != 'namespace' &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.real_ssh_matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the lab's dependency build
        id: dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/real-ssh-dependencies
          key: real-ssh-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/real-ssh/Dockerfile', 'Cargo.toml', 'Cargo.lock', 'build.rs') }}
      - name: Build the lab image
        env:
          CACHE: ${{ runner.temp }}/real-ssh-dependencies
          CACHED: ${{ steps.dependencies.outputs.cache-hit }}
          IMAGE: ${{ runner.temp }}/real-ssh-lab.tar
        run: |
          docker buildx create --use --driver docker-container
          if [ "$CACHED" != true ]; then
            docker buildx build --progress plain --file tests/real-ssh/Dockerfile \
              --target dependencies --cache-to "type=local,dest=$CACHE,mode=max" .
          fi
          docker buildx build --progress plain --file tests/real-ssh/Dockerfile \
            --cache-from "type=local,src=$CACHE" --tag syq-real-ssh-lab \
            --output "type=docker,dest=$IMAGE" .
      - name: Save the lab's dependency build
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/real-ssh-dependencies
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      # The image layers are already compressed. Keep the image long enough
      # to rerun a failed suite a few days later.
      - name: Share the lab image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-ssh-lab
          path: ${{ runner.temp }}/real-ssh-lab.tar
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  # The core suite also runs the storage checks. scripts/ci-scope.py defines
  # the matrix, including the cases the one-session profile skips.
  real-ssh:
    concurrency:
      group: ${{ github.workflow }}-real-ssh-${{ matrix.suite }}-${{ matrix.profile }}-${{ needs.scope.outputs.suite_selection == 'true' && github.ref || github.run_id }}
      cancel-in-progress: ${{ needs.scope.outputs.suite_selection == 'true' }}
    needs: [scope, real-ssh-lab]
    if: >-
      inputs.linux_trial != 'github' && inputs.linux_trial != 'namespace' &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.real_ssh_matrix != '[]'
    name: real-ssh (${{ matrix.suite }}, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.real_ssh_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache pinned development tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/syq-tools
          key: pinned-tools-${{ runner.os }}-${{ runner.arch }}-python-${{ hashFiles('scripts/setup.lock', 'scripts/setup.sh') }}
      - name: Install pinned development tools
        env:
          SYQ_TOOLS_DIR: ${{ runner.temp }}/syq-tools
        run: scripts/setup.sh github python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: real-ssh-lab
          path: ${{ runner.temp }}
      - name: Load the lab image
        run: docker load --input "$RUNNER_TEMP/real-ssh-lab.tar"
      - name: Run the suite through real OpenSSH
        env:
          PROFILE: ${{ matrix.profile }}
          SKIP: ${{ matrix.skip }}
          SUITE: ${{ matrix.suite }}
        run: >-
          scripts/test-real-ssh.py --image syq-real-ssh-lab --profile "$PROFILE" --suite "$SUITE"
          ${SKIP:+--skip-cases-from "$SKIP"}
      - name: Keep real-SSH diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-ssh-diagnostics-${{ matrix.suite }}-${{ matrix.profile }}
          path: target/real-ssh.*/compose.log
          if-no-files-found: ignore
          retention-days: 14

  repository-checks:
    concurrency:
      group: ${{ github.workflow }}-repository-checks-${{ needs.scope.outputs.suite_selection == 'true' && github.ref || github.run_id }}
      cancel-in-progress: ${{ needs.scope.outputs.suite_selection == 'true' }}
    needs: scope
    if: >-
      inputs.linux_trial != 'github' && inputs.linux_trial != 'namespace' &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.repository_checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache pinned development tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/syq-tools
          key: pinned-tools-${{ runner.os }}-${{ runner.arch }}-repository-checks-${{ hashFiles('scripts/setup.lock', 'scripts/setup.sh') }}
      - name: Install pinned development tools
        env:
          SYQ_TOOLS_DIR: ${{ runner.temp }}/syq-tools
        run: scripts/setup.sh github python node mdbook
      - name: Cache Cargo dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ci-repository-checks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-ci-repository-checks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            cargo-ci-repository-checks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      # One build serves the ignored tests, the fixture check and the
      # compatibility check. A plain `cargo build` resolves dependency features
      # without dev-dependencies, so it would compile every dependency again.
      - name: Build test binaries and the candidate syq
        id: build-tests
        run: cargo test --locked --all-targets --no-run
      # The ignored Linux tests are timing and simulation reports.
      - name: Run ignored Linux tests
        if: ${{ !cancelled() && steps.build-tests.outcome == 'success' }}
        run: cargo test --locked --all-targets -- --ignored
      - name: Check that automation fixtures match real output
        if: ${{ !cancelled() && steps.build-tests.outcome == 'success' }}
        run: python3 scripts/regen-automation-fixtures.py --check --no-build
      - name: Check documentation links
        if: ${{ !cancelled() }}
        run: python3 scripts/check-doc-links.py
      - name: Check compatibility with released receivers and clients
        if: ${{ !cancelled() && steps.build-tests.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate="$GITHUB_WORKSPACE/target/debug/syq"
          released="$RUNNER_TEMP/released"
          for version in 0.4.0 0.5.2 0.6.0; do
            mkdir -p "$released/$version"
            gh release download "v$version" --repo "$GITHUB_REPOSITORY" \
              --pattern syq-linux-x86_64 --pattern syq-linux-x86_64.sha256 \
              --dir "$released/$version"
            (cd "$released/$version" && sha256sum --check syq-linux-x86_64.sha256)
            chmod +x "$released/$version/syq-linux-x86_64"
          done
          python3 tests/receive-control-compat.py \
            --old "$released/0.4.0/syq-linux-x86_64" --candidate "$candidate"
          python3 tests/receiver_identity_compat.py \
            "$candidate" "$released/0.5.2/syq-linux-x86_64"
          python3 tests/receive-policy-compat.py \
            --old "$released/0.6.0/syq-linux-x86_64" --candidate "$candidate"

  # The release recipe otherwise runs only during a release. This builds
  # every release platform and checks release dependency-cache invalidation.
  # Scheduled runs only: a release starts its own builds beside a manual run.
  release-build:
    needs: scope
    if: >-
      github.event_name == 'schedule' &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.native == 'true' &&
      needs.scope.outputs.full_suite == 'true'
    uses: ./.github/workflows/reproducible-builds.yml

  # A skipped certificate cannot certify successful selective stubs.
  release-certification:
    needs: [scope, rust, sdks, linux-arm64, macos]
    if: >-
      inputs.linux_trial != 'github' && inputs.linux_trial != 'namespace' &&
      needs.scope.outputs.full_suite == 'true' &&
      needs.scope.outputs.native == 'true' &&
      needs.scope.outputs.python_sdk == 'true' &&
      needs.scope.outputs.linux_arm64 == 'true' &&
      needs.scope.outputs.macos == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Every release validation suite in this workflow succeeded.'

  # Explicit evidence that this scheduled run did not execute validation.
  nightly-unchanged:
    needs: scope
    if: github.event_name == 'schedule' && needs.scope.outputs.native == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Nightly test inputs are unchanged; reuse earlier certified evidence.'
