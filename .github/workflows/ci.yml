name: ci

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.changes.outputs.native }}
      sdks: ${{ steps.changes.outputs.sdks }}
      python_sdk: ${{ steps.changes.outputs.python_sdk }}
      javascript_sdk: ${{ steps.changes.outputs.javascript_sdk }}
      go_sdk: ${{ steps.changes.outputs.go_sdk }}
      tooling: ${{ steps.changes.outputs.tooling }}
      shellcheck: ${{ steps.changes.outputs.shellcheck }}
      mapping_docs: ${{ steps.changes.outputs.mapping_docs }}
      macos: ${{ steps.changes.outputs.macos }}
      linux_arm64: ${{ steps.changes.outputs.linux_arm64 }}
      full_suite: ${{ steps.changes.outputs.full_suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: changes
        run: scripts/ci-scope.sh "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"

  rust:
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful path classification
        if: needs.scope.result != 'success'
        run: echo 'Path classification failed.' >&2; exit 1
      - name: Complete the required check when Rust and tooling are unaffected
        if: >-
          needs.scope.outputs.native != 'true' &&
          needs.scope.outputs.tooling != 'true' &&
          needs.scope.outputs.shellcheck != 'true' &&
          needs.scope.outputs.mapping_docs != 'true'
        run: echo 'Rust, executable documentation, and repository tooling are unaffected.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: >-
          needs.scope.outputs.native == 'true' ||
          needs.scope.outputs.tooling == 'true' ||
          needs.scope.outputs.shellcheck == 'true' ||
          needs.scope.outputs.mapping_docs == 'true'
        with:
          persist-credentials: false
      - name: Install Rust check components
        if: needs.scope.outputs.native == 'true'
        run: rustup component add rustfmt clippy
      - name: Check dependency policy
        if: >-
          needs.scope.outputs.native == 'true' &&
          needs.scope.outputs.full_suite == 'true'
        env:
          CARGO_DENY_VERSION: 0.20.2
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-deny.tar.gz"
          directory="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --proto '=https' \
            --proto-redir '=https' --output "$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$directory.tar.gz"
          printf '%s  %s\n' "$CARGO_DENY_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/$directory/cargo-deny" --version)" = \
            "cargo-deny $CARGO_DENY_VERSION"
          "$RUNNER_TEMP/$directory/cargo-deny" --locked check
      - name: Check Rust formatting
        if: needs.scope.outputs.native == 'true'
        run: cargo fmt --all -- --check
      - name: Lint every Rust target
        if: needs.scope.outputs.native == 'true'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test every native target
        if: >-
          needs.scope.outputs.native == 'true' &&
          needs.scope.outputs.full_suite == 'true'
        run: cargo test --locked --all-targets
      - name: Test executable mapping documentation
        if: >-
          needs.scope.outputs.mapping_docs == 'true' &&
          (needs.scope.outputs.native != 'true' ||
           needs.scope.outputs.full_suite != 'true')
        run: cargo test --locked --test local mappings_md_
      - name: Test Cargo package identity
        if: >-
          needs.scope.outputs.tooling == 'true' ||
          (needs.scope.outputs.native == 'true' &&
           needs.scope.outputs.full_suite == 'true')
        run: scripts/test-cargo-package.sh
      - name: Test installer tooling
        if: >-
          needs.scope.outputs.tooling == 'true' ||
          (needs.scope.outputs.native == 'true' &&
           needs.scope.outputs.full_suite == 'true')
        run: scripts/test-installer.sh
      - name: Test release tooling
        if: >-
          needs.scope.outputs.tooling == 'true' ||
          (needs.scope.outputs.native == 'true' &&
           needs.scope.outputs.full_suite == 'true')
        run: scripts/test-release-tools.sh
      - name: Test release orchestration
        if: >-
          needs.scope.outputs.tooling == 'true' ||
          (needs.scope.outputs.native == 'true' &&
           needs.scope.outputs.full_suite == 'true')
        run: scripts/test-release-orchestration.sh
      - name: Test branch status tooling
        if: >-
          needs.scope.outputs.tooling == 'true' ||
          (needs.scope.outputs.native == 'true' &&
           needs.scope.outputs.full_suite == 'true')
        run: scripts/test-branch-status.sh
      - name: Validate workflow syntax
        if: >-
          needs.scope.outputs.tooling == 'true' ||
          (needs.scope.outputs.native == 'true' &&
           needs.scope.outputs.full_suite == 'true')
        run: scripts/check-workflows.sh
      - name: Test release-secret tooling
        if: >-
          needs.scope.outputs.tooling == 'true' ||
          (needs.scope.outputs.native == 'true' &&
           needs.scope.outputs.full_suite == 'true')
        run: scripts/test-secret-tools.sh
      - name: Lint tracked shell scripts
        if: >-
          needs.scope.outputs.tooling == 'true' ||
          needs.scope.outputs.shellcheck == 'true' ||
          (needs.scope.outputs.native == 'true' &&
           needs.scope.outputs.full_suite == 'true')
        run: git ls-files -z -- '*.sh' | xargs -0 shellcheck

  sdks:
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful path classification
        if: needs.scope.result != 'success'
        run: echo 'Path classification failed.' >&2; exit 1
      - name: Complete the required check when SDKs are unaffected
        if: needs.scope.outputs.sdks != 'true'
        run: echo 'SDK validation is not needed for this change set.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scope.outputs.sdks == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.scope.outputs.python_sdk == 'true'
        with:
          python-version: "3.10"
      - name: Install pinned Python tooling
        if: needs.scope.outputs.python_sdk == 'true'
        run: python -m pip install --disable-pip-version-check --no-deps uv==0.11.6
      - name: Require the matching Python SDK for the latest syq release
        if: needs.scope.outputs.python_sdk == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          pinned_tag=$(jq -er .tag sdk/python/src/syq/syq-release-manifest.json)
          test "$pinned_tag" = "$latest_tag" || {
            echo "Python SDK pins $pinned_tag, but the latest syq release is $latest_tag" >&2
            exit 1
          }
          pinned_version=${pinned_tag#v}
          python_version=$(sed -n 's/^version = "\(.*\)"/\1/p' \
            sdk/python/pyproject.toml)
          test "$python_version" = "$pinned_version" || {
            echo "Python SDK $python_version pins syq $pinned_version; versions must match" >&2
            exit 1
          }
      - name: Build the candidate syq executable
        if: needs.scope.outputs.python_sdk == 'true'
        run: cargo build --locked --bin syq
      - name: Test and reproducibly package Python SDK
        if: needs.scope.outputs.python_sdk == 'true'
        env:
          PYTHONPATH: sdk/python/src
          SYQ_CANDIDATE_EXECUTABLE: ${{ github.workspace }}/target/debug/syq
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/syq-sdk-python
          XDG_CACHE_HOME: ${{ runner.temp }}/syq-sdk-cache
        run: |
          SYQ_CANDIDATE_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          export SYQ_CANDIDATE_VERSION
          scripts/test-python-sdk-release-tools.sh
          uv run --project sdk/python --frozen python -m unittest discover -s sdk/python/tests
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          for output in target/sdk-python-dist-a target/sdk-python-dist-b; do
            uv run --project sdk/python --frozen python -m build sdk/python --outdir "$output"
            python scripts/normalize-python-sdist.py \
              --epoch "$SOURCE_DATE_EPOCH" "$output"/*.tar.gz
            sleep 2
          done
          for artifact in target/sdk-python-dist-a/*; do
            name=${artifact##*/}
            cmp "$artifact" "target/sdk-python-dist-b/$name"
          done
          set -- target/sdk-python-dist-a/syq-*-py3-none-any.whl
          test "$#" -eq 1 && test -f "$1"
          env -u PYTHONPATH uv run --isolated --python 3.10 \
            --with "$1" \
            python -c 'import syq; assert syq.version() == syq.PINNED_SYQ_VERSION'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.scope.outputs.javascript_sdk == 'true'
        with:
          node-version: "22.x"
          package-manager-cache: false
      - name: Test and package JavaScript SDK
        if: needs.scope.outputs.javascript_sdk == 'true'
        working-directory: sdk/js
        run: |
          npm ci --ignore-scripts
          npm test
          npm pack --dry-run
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.scope.outputs.go_sdk == 'true'
        with:
          go-version: "1.26.x"
          cache: false
      - name: Format, vet, and test Go SDK
        if: needs.scope.outputs.go_sdk == 'true'
        working-directory: sdk/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

  # The release workflow builds on this runner; libc field types differ from
  # x86-64 (st_nlink is u32 here), so check it after native changes land.
  linux-arm64:
    needs: scope
    if: always()
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Require successful path classification
        if: needs.scope.result != 'success'
        run: echo 'Path classification failed.' >&2; exit 1
      - name: Complete the required check when ARM validation is deferred
        if: needs.scope.outputs.linux_arm64 != 'true'
        run: echo 'ARM validation is deferred to the cumulative post-merge suite.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scope.outputs.linux_arm64 == 'true'
        with:
          persist-credentials: false
      - if: needs.scope.outputs.linux_arm64 == 'true'
        run: cargo check --locked --all-targets

  macos_arm:
    needs: scope
    if: >-
      needs.scope.result == 'success' &&
      needs.scope.outputs.macos == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo check --locked --all-targets
      - name: Exercise macOS symlink descriptor pinning
        run: >-
          cargo test --locked
          rooted::tests::operator_resolver_selects_a_last_component_symlink_without_following_it
          -- --exact
      - name: Exercise macOS cross-process descriptor handoff
        run: >-
          cargo test --locked
          descriptor_broker::tests::independent_process_receives_exact_registered_descriptor
          -- --exact
      - name: Exercise macOS descriptor soft-limit raise and umask read
        run: >-
          cargo test --locked --bin syq --
          --exact tests::raise_nofile_reaches_its_target
          fsops::tests::process_umask_matches_file_creation
      - name: Exercise macOS descriptor-pressure bounds
        run: cargo test --locked --test local source_fd_budget_
      - name: Exercise macOS adversarial confinement matrix
        run: cargo test --locked confinement_matrix_
      - name: Exercise macOS standalone updates
        run: cargo test --locked --test update
      - name: Exercise macOS managed remote-helper bootstrap
        run: cargo test --locked --test local remote_
      - name: Exercise macOS socket-special behavior
        run: |
          cargo test --locked --test local native_preserve_specials_copies_or_visibly_skips_socket_nodes -- --exact
          cargo test --locked --test local native_remote_destination_socket_policy_uses_handshake_capability -- --exact
      - run: scripts/test-installer.sh
      - run: scripts/test-homebrew-formula.sh

  # An actual Intel runner catches host-architecture cfg and libc differences
  # before the release workflow builds its x86-64 artifact. Keep this on full
  # master and manual runs.
  macos_intel:
    needs: scope
    if: >-
      needs.scope.result == 'success' &&
      needs.scope.outputs.macos == 'true' &&
      needs.scope.outputs.full_suite == 'true'
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo check --locked --all-targets
      - name: Exercise the Intel standalone-update artifact selection
        run: cargo test --locked --test update

  # Preserve the `macos` release-evidence name while making full certifications
  # depend on both architectures.
  macos:
    needs: [scope, macos_arm, macos_intel]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful path classification
        if: needs.scope.result != 'success'
        run: echo 'Path classification failed.' >&2; exit 1
      - name: Complete the required check when macOS validation is unaffected
        if: needs.scope.outputs.macos != 'true'
        run: echo 'macOS validation is not needed for this change set.'
      - name: Require Apple Silicon validation
        if: >-
          needs.scope.outputs.macos == 'true' &&
          needs.macos_arm.result != 'success'
        run: echo 'Apple Silicon macOS validation failed or did not complete.' >&2; exit 1
      - name: Require Intel validation in a full suite
        if: >-
          needs.scope.outputs.macos == 'true' &&
          needs.scope.outputs.full_suite == 'true' &&
          needs.macos_intel.result != 'success'
        run: echo 'Intel macOS validation failed or did not complete.' >&2; exit 1
      - name: Record successful macOS validation
        if: >-
          needs.scope.outputs.macos == 'true' &&
          needs.macos_arm.result == 'success' &&
          (needs.scope.outputs.full_suite != 'true' ||
           needs.macos_intel.result == 'success')
        run: echo 'Required macOS validation succeeded.'

  # A skipped certificate cannot certify successful selective stubs.
  release-certification:
    needs: [scope, rust, sdks, linux-arm64, macos]
    if: >-
      needs.scope.outputs.full_suite == 'true' &&
      needs.scope.outputs.native == 'true' &&
      needs.scope.outputs.python_sdk == 'true' &&
      needs.scope.outputs.javascript_sdk == 'true' &&
      needs.scope.outputs.go_sdk == 'true' &&
      needs.scope.outputs.linux_arm64 == 'true' &&
      needs.scope.outputs.macos == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Every release validation suite in this workflow succeeded.'
