name: Wheel diagnosis
on:
  push:
    branches: [investigate-python-ci-0916]
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Cargo dependencies and build output
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-macos-suite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: cargo-macos-suite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
      - run: cargo build --locked --bin syq
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ">=3.13.4 <3.14"
          check-latest: true
      - name: Install pinned Python tooling
        run: python -m pip install --disable-pip-version-check --no-deps uv==0.11.6
      - name: Use Homebrew OpenSSL for Ed25519 signing
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Test and reproducibly package Python SDK
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          PYTHONPATH: sdk/python/src
          SYQ_CANDIDATE_EXECUTABLE: ${{ github.workspace }}/target/debug/syq
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/syq-sdk-python
          XDG_CACHE_HOME: ${{ runner.temp }}/syq-sdk-cache
        run: |
          SYQ_CANDIDATE_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          export SYQ_CANDIDATE_VERSION
          scripts/test-python-sdk-release-tools.sh
          uv run --project sdk/python --frozen python -m unittest discover -s sdk/python/tests
          export SOURCE_DATE_EPOCH RUSTUP_TOOLCHAIN
          RUSTUP_TOOLCHAIN=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          for output in target/sdk-python-dist-a target/sdk-python-dist-b; do
            # Restored Cargo caches can contain distributions from an older SDK.
            rm -rf -- "$output"
            MATURIN_PEP517_ARGS="--profile dev" uv run --project sdk/python --frozen python -m build sdk/python --sdist --wheel --outdir "$output"
            python scripts/normalize-python-sdist.py \
              --epoch "$SOURCE_DATE_EPOCH" "$output"/*.tar.gz
            sleep 2
          done
      - name: Preserve both builds
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheel-diagnosis
          path: |
            target/sdk-python-dist-a
            target/sdk-python-dist-b
          retention-days: 3
