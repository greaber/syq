name: rsync compatibility

on:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# CI builds start from a clean checkout, so incremental compilation data only
# costs build time and cache space.
env:
  CARGO_INCREMENTAL: "0"

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      conformance: ${{ steps.changes.outputs.conformance }}
      full_suite: ${{ steps.changes.outputs.full_suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cache pinned development tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/syq-tools
          key: pinned-tools-${{ runner.os }}-${{ runner.arch }}-jq-python-${{ hashFiles('scripts/setup.lock', 'scripts/setup.sh') }}
      - name: Install pinned development tools
        env:
          SYQ_TOOLS_DIR: ${{ runner.temp }}/syq-tools
        run: scripts/setup.sh github jq python
      - name: Classify changed paths
        env:
          GH_TOKEN: ${{ github.token }}
        id: changes
        run: scripts/ci-scope.py "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"

  conformance_platforms:
    # Cancel only matching automatic checks; manual runs keep a unique group.
    concurrency:
      group: ${{ github.workflow }}-conformance_platforms-${{ github.event_name == 'push' && github.ref || github.run_id }}-${{ matrix.os }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    needs: scope
    if: >-
      needs.scope.result == 'success' &&
      needs.scope.outputs.conformance == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.full_suite == 'true' && '[{"os":"ubuntu-latest","label":"linux"},{"os":"macos-26","label":"macos"}]' || '[{"os":"ubuntu-latest","label":"linux"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: target/cargo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache pinned development tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/syq-tools
          key: pinned-tools-${{ runner.os }}-${{ runner.arch }}-python-${{ hashFiles('scripts/setup.lock', 'scripts/setup.sh') }}
      - name: Install pinned development tools
        env:
          SYQ_TOOLS_DIR: ${{ runner.temp }}/syq-tools
        run: scripts/setup.sh github python
      - name: Cache pinned rsync source and helpers
        id: rsync-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/rsync-compat/sources
            target/rsync-compat/suites
          key: rsync-compat-${{ runner.os }}-${{ hashFiles('scripts/rsync-compat.py', 'tests/rsync-compat/manifest.toml', 'tests/rsync-compat/inventory.tsv', 'tests/rsync-compat/adaptations/*.patch') }}
      - name: Install Linux rsync test-build prerequisites
        if: runner.os == 'Linux' && steps.rsync-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential
      - name: Install macOS rsync test-build prerequisites
        if: runner.os == 'macOS' && steps.rsync-cache.outputs.cache-hit != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install autoconf automake
      # Cargo caches hold one entry per toolchain and dependency set. Only
      # master saves them, so task branches neither fill the repository's
      # cache budget nor replace master's entries.
      - name: Restore Cargo dependencies and build output
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/cargo
          key: cargo-rsync-compat-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-rsync-compat-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Test compatibility harness
        run: python tests/rsync-compat/harness_test.py
      - name: Run classified upstream tests
        run: python scripts/rsync-compat.py --require-tests --test-timeout 120 -j 4
      - name: Run suite as root, including root-only circumstances
        run: |
          sudo env \
            PATH="$PATH" \
            CARGO_TARGET_DIR="$CARGO_TARGET_DIR" \
            GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" \
            python scripts/rsync-compat.py --require-tests --report-label root \
              --no-build-syq --syq-bin "$PWD/target/cargo/debug/syq" \
              --test-timeout 120 -j 4
      - name: Save Cargo dependencies and build output
        if: >-
          github.ref == 'refs/heads/master' &&
          steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/cargo
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Restore compatibility-cache ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" target/rsync-compat
      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rsync-compatibility-${{ matrix.label }}
          path: target/rsync-compat/reports/
          if-no-files-found: warn

  # Keep the conformance release-evidence name stable while making it depend
  # on the selected platform cells above.
  conformance:
    needs: [scope, conformance_platforms]
    if: always() && needs.conformance_platforms.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Require successful path classification
        if: needs.scope.result != 'success'
        run: echo 'Path classification failed.' >&2; exit 1
      - name: Complete the required check when conformance is unaffected
        if: needs.scope.outputs.conformance != 'true'
        run: echo 'Rsync conformance is deferred because this change does not affect it.'
      - name: Require selected conformance
        if: >-
          needs.scope.outputs.conformance == 'true' &&
          needs.conformance_platforms.result != 'success'
        run: echo 'A platform conformance job failed or did not complete.' >&2; exit 1
      - name: Record selected conformance
        if: >-
          needs.scope.outputs.conformance == 'true' &&
          needs.conformance_platforms.result == 'success'
        run: echo 'Selected rsync conformance succeeded.'

  # A skipped certificate cannot certify successful selective stubs.
  release-certification:
    needs: [scope, conformance]
    if: >-
      needs.scope.outputs.full_suite == 'true' &&
      needs.scope.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Every release validation suite in this workflow succeeded.'

  # Explicit evidence that this scheduled run did not execute validation.
  nightly-unchanged:
    needs: scope
    if: github.event_name == 'schedule' && needs.scope.outputs.conformance == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Nightly test inputs are unchanged; reuse earlier certified evidence.'
