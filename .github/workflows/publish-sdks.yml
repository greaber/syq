name: publish SDKs

on:
  # Manual runs build and test Python distributions without publishing.
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Expected SDK merge commit for a preparation build
        type: string
        default: ''
      rebuild:
        description: Rebuild Python distributions and compare complete output bytes
        type: boolean
        default: false
  push:
    tags:
      - "sdk-python-v*"
      - "sdk-js-v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: verify signed SDK tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a verified annotated tag for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/verify-release-tag.sh \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" master sdks

  candidate-python:
    name: find prepared Python distributions
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-python-v')
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      actions: read
      contents: read
    outputs:
      run-id: ${{ steps.candidate.outputs.run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/find-release-build.py "$GITHUB_REPOSITORY" "$GITHUB_SHA"
          --python-version "${GITHUB_REF_NAME#sdk-python-v}" >> "$GITHUB_OUTPUT"

  build-python:
    name: build Python SDK (${{ matrix.target }})
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
      (needs.verify-tag.result == 'success' && needs.candidate-python.result == 'success' &&
      needs.candidate-python.outputs.run-id == '' && startsWith(github.ref, 'refs/tags/sdk-python-v')))
    needs: [verify-tag, candidate-python]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            sdist: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            sdist: false
          - os: macos-26
            target: aarch64-apple-darwin
            sdist: false
          - os: macos-26-intel
            target: x86_64-apple-darwin
            sdist: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the requested candidate commit
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_commit != ''
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: test "$GITHUB_SHA" = "$CANDIDATE_COMMIT"
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.13"
      - name: Install pinned Python tooling
        run: python -m pip install --disable-pip-version-check --no-deps uv==0.11.6
      - name: Install checksum-pinned Nix
        run: scripts/install-nix-ci.sh
      - name: Verify the pinned native release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c \
            'import tomllib; print(tomllib.load(open("sdk/python/pyproject.toml", "rb"))["project"]["version"])')
          if test "$GITHUB_EVENT_NAME" = push; then
            test "$GITHUB_REF_NAME" = "sdk-python-v$version"
          fi
          test "$version" = "$(jq -er .version sdk/python/src/syq/syq-release-manifest.json)"
          test "$(gh release view "v$version" --json tagName,isDraft,isImmutable \
            --jq '[.tagName, .isDraft, .isImmutable] | @tsv')" = "v$version"$'\tfalse\ttrue'
          test "$(git rev-parse "refs/tags/v$version^{commit}")" = \
            "$(jq -er .rev sdk/python/native-source.json)"
      - name: Build distributions from locked inputs
        run: |
          scripts/build-python-dist.sh "$GITHUB_WORKSPACE/sdk-dist"
          if ! ${{ matrix.sdist }}; then
            rm sdk-dist/*.tar.gz
          fi
      - name: Rebuild and compare complete distributions
        if: github.event_name == 'workflow_dispatch' && inputs.rebuild
        run: >-
          nix --extra-experimental-features 'nix-command flakes' build
          .#python-dist --rebuild --no-update-lock-file --no-link -L
      - name: Test the installed distribution
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -er .version sdk/python/src/syq/syq-release-manifest.json)
          set -- sdk-dist/syq-*-py3-none-*.whl
          test "$#" -eq 1 && test -f "$1"
          uv venv "$RUNNER_TEMP/wheel-test"
          uv pip install --python "$RUNNER_TEMP/wheel-test/bin/python" --no-deps "$1"
          uv export --project sdk/python --frozen --only-group dev --no-header --no-annotate |
            awk '/^[^[:space:]]/ { keep = /^pyyaml==/ } keep' > "$RUNNER_TEMP/wheel-test-requirements.txt"
          test -s "$RUNNER_TEMP/wheel-test-requirements.txt"
          uv pip install --python "$RUNNER_TEMP/wheel-test/bin/python" --no-deps \
            --require-hashes --only-binary :all: -r "$RUNNER_TEMP/wheel-test-requirements.txt"
          "$RUNNER_TEMP/wheel-test/bin/python" scripts/check-python-wheel.py \
            --version "$version" --identity "v$version"
          SYQ_CANDIDATE_EXECUTABLE=$("$RUNNER_TEMP/wheel-test/bin/python" -c \
            'from syq.bundled import bundled_executable; print(bundled_executable())')
          export SYQ_CANDIDATE_EXECUTABLE
          if test "$(uname -s)" = Linux; then
            readelf -l "$SYQ_CANDIDATE_EXECUTABLE" > "$RUNNER_TEMP/elf-headers"
            if grep 'INTERP' "$RUNNER_TEMP/elf-headers"; then exit 1; fi
          else
            otool -L "$SYQ_CANDIDATE_EXECUTABLE"
            if otool -L "$SYQ_CANDIDATE_EXECUTABLE" | grep '/nix/store/'; then exit 1; fi
            minimum=$(otool -l "$SYQ_CANDIDATE_EXECUTABLE" | awk '$1 == "cmd" { command = $2 }
              (command == "LC_BUILD_VERSION" && $1 == "minos") ||
              (command == "LC_VERSION_MIN_MACOSX" && $1 == "version") { print $2 }')
            if test "$(uname -m)" = arm64; then
              test "$minimum" = 11.0
              codesign --verify "$SYQ_CANDIDATE_EXECUTABLE"
            else
              test "$minimum" = 10.12
            fi
          fi
          SYQ_CANDIDATE_VERSION="$version" "$RUNNER_TEMP/wheel-test/bin/python" \
            -m unittest discover -s sdk/python/tests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: python-sdk-${{ matrix.target }}
          path: sdk-dist/*
          if-no-files-found: error
          retention-days: 1

  publish-python:
    name: publish Python SDK
    if: >-
      always() && !cancelled() && github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/sdk-python-v') &&
      needs.verify-tag.result == 'success' && needs.candidate-python.result == 'success' &&
      (needs.build-python.result == 'success' ||
       (needs.build-python.result == 'skipped' && needs.candidate-python.outputs.run-id != ''))
    needs: [verify-tag, candidate-python, build-python]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Install pinned publishing tooling
        run: python -m pip install --disable-pip-version-check --no-deps uv==0.11.6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.candidate-python.outputs.run-id || github.run_id }}
          pattern: python-sdk-*
          merge-multiple: true
          path: sdk-dist
      - name: Publish immutable distributions
        run: >-
          uv publish --trusted-publishing always
          --check-url https://pypi.org/simple/
          sdk-dist/*

  build-js:
    name: build JavaScript SDK
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-js-v')
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify version and tests
        working-directory: sdk/js
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "sdk-js-v$version"
          npm ci --ignore-scripts
          npm test
      - name: Pack the public package
        working-directory: sdk/js
        run: |
          mkdir -p ../../sdk-dist
          npm pack --pack-destination ../../sdk-dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: javascript-sdk-package
          path: sdk-dist/*
          if-no-files-found: error
          retention-days: 1

  publish-js:
    name: publish JavaScript SDK
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-js-v')
    needs: build-js
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: javascript-sdk-package
          path: sdk-dist
      - name: Publish or verify the immutable package
        shell: bash
        run: |
          package=$(find sdk-dist -mindepth 1 -maxdepth 1 -type f -name '*.tgz')
          test -n "$package"
          test "$(find sdk-dist -mindepth 1 -maxdepth 1 -type f -name '*.tgz' | wc -l)" -eq 1
          version=${GITHUB_REF_NAME#sdk-js-v}
          if published_sha=$(npm view "@syq/sdk@$version" dist.shasum); then
            actual_sha=$(sha1sum "$package" | cut -d ' ' -f 1)
            test "$actual_sha" = "$published_sha" || {
              echo "npm already has different bytes for @syq/sdk@$version" >&2
              exit 1
            }
            echo "npm already contains the exact @syq/sdk@$version package"
            exit 0
          fi
          npm publish "$package" --access public
