# Build all supported targets, assemble one complete signed release, attest its
# contents, publish it draft-first, publish the source crate, then update the
# project-owned Homebrew tap.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-tag:
    name: verify signed release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require curated release notes
        run: test -s ".github/release-notes/$GITHUB_REF_NAME.md"
      - name: Require the Python native API to be synchronized
        run: python3 scripts/check-python-api-sync.py
      - name: Validate pinned release inputs
        env:
          SYQ_RELEASE_PUBLIC_KEY: ${{ vars.SYQ_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test "$SYQ_RELEASE_PUBLIC_KEY" = "$(cat src/release-public-key.txt)"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Require a verified annotated tag for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/verify-release-tag.sh \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" master \
            rust,sdks,macos,linux-arm64,conformance
          scripts/verify-release-ci.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA"

  build:
    needs: verify-tag
    uses: ./.github/workflows/reproducible-builds.yml

  source-crate:
    name: validate source crate
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Cache Cargo dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-source-crate-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-source-crate-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            cargo-ci-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
      - name: Compile and validate the source package once
        run: scripts/prepare-release-crate.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/source-crate"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-crate
          path: ${{ runner.temp }}/source-crate/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: verify, attest, and publish
    needs: [build, source-crate]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the validated source package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: source-crate
          path: ${{ runner.temp }}/source-crate
      - name: Require identical source-package bytes before any publication
        run: scripts/verify-prepared-crate.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/source-crate"
      - name: Download every target
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: syq-*
          path: dist
          merge-multiple: true
      - name: Restore canonicalizer permission
        run: chmod 755 dist/syq-linux-x86_64
      - name: Build and validate release metadata
        run: scripts/package-release.sh "$GITHUB_REF_NAME" dist
      - name: Sign release manifest and verify the configured key
        env:
          SYQ_RELEASE_PUBLIC_KEY: ${{ vars.SYQ_RELEASE_PUBLIC_KEY }}
          SYQ_RELEASE_SIGNING_KEY_PEM_B64: ${{ secrets.SYQ_RELEASE_SIGNING_KEY_PEM_B64 }}
        run: |
          scripts/sign-release-manifest.sh \
            dist/syq-release-manifest.json dist/syq-linux-x86_64
      - name: Verify final release inventory
        shell: bash
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/expected-assets"
          for asset in syq-linux-x86_64 syq-linux-aarch64 syq-macos-arm64 syq-macos-x86_64; do
            printf '%s\n' "$asset" "$asset.sha256" "$asset.gz" "$asset.gz.sha256"
          done > "$expected"
          printf '%s\n' install.sh syq-release-manifest.json syq.rb >> "$expected"
          sort -o "$expected" "$expected"
          find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | sort > "$RUNNER_TEMP/actual-assets"
          diff -u "$expected" "$RUNNER_TEMP/actual-assets"
          ruby -c dist/syq.rb
          scripts/smoke-release-installer.py dist
      - name: Refuse a divergent published release
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --json isDraft > "$RUNNER_TEMP/release-state" 2>/dev/null; then
            echo 'published=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          draft=$(jq -r .isDraft "$RUNNER_TEMP/release-state")
          test "$draft" = false || {
            echo "Draft $GITHUB_REF_NAME already exists; inspect and remove it before retrying." >&2
            exit 1
          }
          scripts/verify-release-assets.sh "$GITHUB_REF_NAME" dist
          echo 'published=true' >> "$GITHUB_OUTPUT"
      - name: Attest all release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*
      - name: Create, verify, and publish a new immutable release
        if: steps.release_state.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_notes=".github/release-notes/$GITHUB_REF_NAME.md"
          test -s "$release_notes" || {
            echo "Release notes are missing: $release_notes" >&2
            exit 1
          }
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "syq ${GITHUB_REF_NAME#v}" --generate-notes \
            --notes "$(cat "$release_notes")"
          gh release upload "$GITHUB_REF_NAME" dist/*
          scripts/verify-release-assets.sh "$GITHUB_REF_NAME" dist
          gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Check whether crates.io already has this exact package
        id: crates_io_state
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          if scripts/verify-crates-io-package.sh \
            "$version" "target/package/syq-$version.crate"; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          else
            status=$?
            test "$status" -eq 3
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate to crates.io
        if: steps.crates_io_state.outputs.published != 'true'
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish the source crate
        if: steps.crates_io_state.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: cargo publish --locked --no-verify
      - name: Verify the published source crate
        if: steps.crates_io_state.outputs.published != 'true'
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          scripts/verify-crates-io-package.sh \
            "$version" "target/package/syq-$version.crate"
      - name: Check out project-owned tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: greaber/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Commit formula update
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          cp dist/syq.rb tap/Formula/syq.rb
          cd tap
          git diff --check
          git add Formula/syq.rb
          git diff --cached --quiet && {
            echo 'The tap already contains this exact formula version.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "syq ${GITHUB_REF_NAME#v}"
          git push
