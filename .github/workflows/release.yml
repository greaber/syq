# Build release binaries for the J servers (Linux x86_64) and Mac users
# (Apple Silicon + Intel), and attach them to a GitHub Release.
#
# Trigger: push a tag like v0.1.0  (git tag v0.1.0 && git push origin v0.1.0)
# or run manually from the Actions tab (workflow_dispatch).
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release and upload assets

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: pcp-linux-x86_64            # static, runs on any glibc-or-not Linux
            flags: "-C target-feature=+crt-static"
          - os: macos-14                       # Apple Silicon runner
            target: aarch64-apple-darwin
            name: pcp-macos-arm64
          - os: macos-13                       # Intel runner
            target: x86_64-apple-darwin
            name: pcp-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.flags }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/pcp dist/${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
