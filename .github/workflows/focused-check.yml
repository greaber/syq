name: Focused check
run-name: Focused check (${{ inputs.runner }}) at ${{ inputs.revision || github.sha }}

# Deliberate, maintainer-dispatched shell code. No automatic triggers or release
# certification: success means only that the submitted script exited zero.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Operating system
        type: choice
        default: linux
        options: [linux, macos, macos-intel]
      script:
        description: Bash script to run (public; do not include secrets)
        type: string
        required: true
      revision:
        description: Exact commit to check out (defaults to workflow commit)
        type: string
      cargo_cache:
        description: Restore the matching CI job's Cargo cache for Rust checks
        type: boolean
        default: false
      timeout:
        description: Timeout in minutes
        type: string
        default: "15"
      label:
        description: Names this check in its job name (the helper passes a script digest)
        type: string

permissions:
  contents: read

# CI builds start from a clean checkout, so incremental compilation data only
# costs build time and cache space.
env:
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    # scripts/branch-status.py identifies a check by its job name. It keeps
    # `github` from when the provider was a choice, so reruns of earlier
    # checks still match them.
    name: check (${{ inputs.runner }}, github${{ inputs.label && format(', {0}', inputs.label) || '' }})
    runs-on: ${{ inputs.runner == 'macos-intel' && 'macos-26-intel' || inputs.runner == 'macos' && 'macos-26' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ fromJSON(inputs.timeout) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Match the Intel CI test profile
        if: inputs.runner == 'macos-intel'
        run: |
          printf '%s\n' CARGO_PROFILE_DEV_OPT_LEVEL=0 CARGO_PROFILE_TEST_OPT_LEVEL=0 \
            >> "$GITHUB_ENV"
      # C dependencies rebuild when this differs from the cached macOS build.
      - name: Match the macOS suite's deployment target
        if: inputs.runner == 'macos'
        run: echo MACOSX_DEPLOYMENT_TARGET=11.0 >> "$GITHUB_ENV"
      # Restore only: master runs of the matching CI job save these entries.
      - name: Restore the matching CI job's Cargo cache
        if: inputs.cargo_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ inputs.runner == 'macos-intel' && 'ci-macos_intel-fast-v1' || inputs.runner == 'macos' && 'macos-suite' || 'ci-rust' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ inputs.runner == 'macos-intel' && 'ci-macos_intel-fast-v1' || inputs.runner == 'macos' && 'macos-suite' || 'ci-rust' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Install the pinned Rust test runner
        if: inputs.cargo_cache
        env:
          SYQ_TOOLS_DIR: ${{ runner.temp }}/syq-tools
        run: scripts/setup.sh github cargo-nextest
      - name: Run the selected check
        shell: bash
        env:
          CHECK_SCRIPT: ${{ inputs.script }}
        run: |
          echo "Checking $(git rev-parse HEAD) on $(uname -s)/$(uname -m)"
          test -n "$CHECK_SCRIPT"
          printf '%s\n' "$CHECK_SCRIPT" > "$RUNNER_TEMP/syq-focused-check.sh"
          bash --noprofile --norc -euo pipefail "$RUNNER_TEMP/syq-focused-check.sh"
