name: reproducible builds

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-crate:
    name: validate source crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Cache Cargo dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-source-crate-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-source-crate-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            cargo-ci-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            cargo-source-crate-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            cargo-ci-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            cargo-source-crate-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
            cargo-ci-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Compile and validate the source package once
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          scripts/prepare-release-crate.sh "v$version" "$RUNNER_TEMP/source-crate"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-crate
          overwrite: true
          path: ${{ runner.temp }}/source-crate/*
          if-no-files-found: error
          retention-days: 7

  build:
    name: build (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-24.04, name: syq-linux-x86_64 }
          - { os: ubuntu-24.04-arm, name: syq-linux-aarch64 }
          - { os: macos-26, name: syq-macos-arm64 }
          - { os: macos-26-intel, name: syq-macos-x86_64 }
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install checksum-pinned Nix
        run: scripts/install-nix-ci.sh
      - name: Build from locked inputs and smoke-test the executable
        run: scripts/build-reproducible.sh "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.platform.name }}
          overwrite: true
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 7
