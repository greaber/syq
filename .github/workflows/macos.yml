name: macOS suite

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}

permissions:
  contents: read

jobs:
  suite:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain and environment
        run: |
          rustc --version
          cargo --version
          bash --version | head -1
          echo "TMPDIR=$TMPDIR"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
        continue-on-error: true
      - name: Unit tests
        run: cargo test --locked --bin syq --no-fail-fast
        continue-on-error: true
      - name: Integration tests
        run: cargo test --locked --all-targets --no-fail-fast
        continue-on-error: true
      - name: Shell tool tests
        continue-on-error: true
        run: |
          set +e
          for s in scripts/test-release-tools.sh scripts/test-release-orchestration.sh scripts/test-secret-tools.sh scripts/test-python-sdk-release-tools.sh scripts/test-installer.sh scripts/test-homebrew-formula.sh; do
            echo "=== $s"; "$s"; echo "=== $s exit $?"
          done
