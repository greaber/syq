name: macOS suite

# The complete native and SDK test suites, clippy, and release shell suites on
# macOS. Automated validation runs after merges to master and on demand, not
# on pull requests.
on:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner provider for this manual run
        type: choice
        default: namespace
        options:
          - github
          - namespace
      benchmark:
        description: Also run the independent APFS timing benchmark
        type: boolean
        default: false
      test_name:
        description: Exact Rust test name (empty runs the full suite)
        required: false
        type: string
      test_target:
        description: Cargo target for the exact test
        required: false
        default: syq
        type: choice
        options:
          - syq
          - local
          - help
          - output
          - update
          - return_handoff
          - macos_exfat
          - s3

permissions:
  contents: read
  actions: read

jobs:
  focused-test:
    if: github.event_name == 'workflow_dispatch' && inputs.test_name != ''
    runs-on: ${{ inputs.runner != 'github' && 'namespace-profile-syq-macos' || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Attach Namespace Cargo cache
        if: inputs.runner != 'github'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
      - name: Show Namespace runner hardware
        if: inputs.runner != 'github'
        run: |
          sw_vers
          sysctl hw.model hw.ncpu hw.memsize machdep.cpu.brand_string
          df -h .
      - name: Restore Cargo dependencies and build output
        if: inputs.runner == 'github'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-macos-suite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-macos-suite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            cargo-macos-suite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            cargo-macos-suite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Cache pinned development tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/syq-tools
          key: dev-tools-${{ runner.os }}-${{ runner.arch }}-jq-python-${{ hashFiles('scripts/dev-tools.lock', 'scripts/dev-tools.sh') }}
      - name: Install pinned development tools
        env:
          SYQ_TOOLS_DIR: ${{ runner.temp }}/syq-tools
        run: scripts/dev-tools.sh github jq python
      - name: Run the exact test
        shell: bash
        env:
          TEST_NAME: ${{ inputs.test_name }}
          TEST_TARGET: ${{ inputs.test_target || 'syq' }}
        run: |
          # Inputs remain data; accept only ordinary Rust test identifiers.
          [[ "$TEST_NAME" =~ ^[a-zA-Z_][a-zA-Z0-9_:]*$ ]] || {
            echo 'Provide a fully qualified Rust test name.' >&2
            exit 2
          }
          case "$TEST_TARGET" in
            syq) target=(--bin syq) ;;
            local|help|output|update|return_handoff|macos_exfat|s3)
              target=(--test "$TEST_TARGET") ;;
            *) echo "Unknown test target: $TEST_TARGET" >&2; exit 2 ;;
          esac
          # Cargo otherwise succeeds when the exact filter matches no test.
          listing=$(cargo test --locked "${target[@]}" "$TEST_NAME" -- --exact --list)
          if ! grep -Fx -- "$TEST_NAME: test" <<< "$listing"; then
            echo "Exact test not found in $TEST_TARGET: $TEST_NAME" >&2
            exit 1
          fi
          # An explicitly selected ignored test must actually run too.
          cargo test --locked "${target[@]}" "$TEST_NAME" -- --exact --include-ignored

  scope:
    if: github.event_name != 'workflow_dispatch' || inputs.test_name == ''
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.changes.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cache pinned development tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/syq-tools
          key: dev-tools-${{ runner.os }}-${{ runner.arch }}-jq-python-${{ hashFiles('scripts/dev-tools.lock', 'scripts/dev-tools.sh') }}
      - name: Install pinned development tools
        env:
          SYQ_TOOLS_DIR: ${{ runner.temp }}/syq-tools
        run: scripts/dev-tools.sh github jq python
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          scope=$(scripts/ci-scope.sh "$GITHUB_EVENT_PATH")
          # ci-scope output is a machine-readable boolean contract.
          needed=false
          # Only explicit macOS changes select this platform after a merge.
          # Manual and changed-input nightly runs select the complete suite.
          for key in macos; do
            if [[ $'\n'"$scope"$'\n' == *$'\n'"$key=true"$'\n'* ]]; then
              needed=true
            fi
          done
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

  suite:
    # Cancel only matching automatic checks; manual runs keep a unique group.
    concurrency:
      group: ${{ github.workflow }}-suite-${{ github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    needs: scope
    if: needs.scope.outputs.needed == 'true'
    runs-on: ${{ inputs.runner != 'github' && 'namespace-profile-syq-macos' || 'macos-26' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Attach Namespace Cargo cache
        if: inputs.runner != 'github'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
      - name: Show Namespace runner hardware
        if: inputs.runner != 'github'
        run: |
          sw_vers
          sysctl hw.model hw.ncpu hw.memsize machdep.cpu.brand_string
          df -h .
      - name: Cache Cargo dependencies and build output
        if: inputs.runner == 'github'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-macos-suite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-macos-suite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            cargo-macos-suite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            cargo-macos-suite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Cache pinned development tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/syq-tools
          key: dev-tools-${{ runner.os }}-${{ runner.arch }}-suite-${{ hashFiles('scripts/dev-tools.lock', 'scripts/dev-tools.sh') }}
      - name: Install pinned development tools
        env:
          SYQ_TOOLS_DIR: ${{ runner.temp }}/syq-tools
        run: scripts/dev-tools.sh github jq uv python node go
      - name: Show toolchain and environment
        run: |
          rustc --version
          cargo --version
          bash --version | head -1
          echo "TMPDIR=$TMPDIR"
      - run: rustup component add clippy
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Native tests
        run: cargo test --locked --all-targets --no-fail-fast
      - name: Build the candidate syq executable
        run: cargo build --locked --bin syq
      - name: Use Homebrew OpenSSL for Ed25519 signing
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Test and package Python SDK
        env:
          PYTHONPATH: sdk/python/src
          SYQ_CANDIDATE_EXECUTABLE: ${{ github.workspace }}/target/debug/syq
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/syq-sdk-python
          XDG_CACHE_HOME: ${{ runner.temp }}/syq-sdk-cache
        run: |
          SYQ_CANDIDATE_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          export SYQ_CANDIDATE_VERSION
          scripts/test-python-sdk-release-tools.sh
          uv run --project sdk/python --frozen python -m unittest discover -s sdk/python/tests
          export SOURCE_DATE_EPOCH RUSTUP_TOOLCHAIN
          RUSTUP_TOOLCHAIN=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          # Match release packaging by stripping macOS debug symbols.
          output=target/sdk-python-dist
          # Restored Cargo caches can contain distributions from an older SDK.
          rm -rf -- "$output"
          MATURIN_PEP517_ARGS="--profile dev --strip" uv run --project sdk/python --frozen python -m build sdk/python --sdist --wheel --outdir "$output"
          python scripts/normalize-python-sdist.py \
            --epoch "$SOURCE_DATE_EPOCH" "$output"/*.tar.gz
          set -- target/sdk-python-dist/syq-*-py3-none-*.whl
          test "$#" -eq 1 && test -f "$1"
          env -u PYTHONPATH uv run --isolated --python "$UV_PYTHON" \
            --with "$1" \
            python scripts/check-python-wheel.py --version "$SYQ_CANDIDATE_VERSION"
          rm -rf -- target/sdk-python-from-sdist
          MATURIN_PEP517_ARGS="--profile dev --strip" uv build --wheel \
            target/sdk-python-dist/*.tar.gz --out-dir target/sdk-python-from-sdist
          set -- target/sdk-python-from-sdist/syq-*-py3-none-*.whl
          test "$#" -eq 1 && test -f "$1"
          env -u PYTHONPATH uv run --isolated --python "$UV_PYTHON" \
            --with "$1" \
            python scripts/check-python-wheel.py --version "$SYQ_CANDIDATE_VERSION"
      - name: Test and package JavaScript SDK
        working-directory: sdk/js
        run: |
          npm ci --ignore-scripts
          npm test
          npm pack --dry-run
      - name: Format, vet, and test Go SDK
        working-directory: sdk/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: Test interactive benchmark with system Bash
        run: python3 scripts/test-try-benchmark.py
      - name: Release shell suites
        run: |
          status=0
          for suite in \
            scripts/test-release-tools.sh \
            scripts/test-release-orchestration.sh \
            scripts/test-installer.sh \
            scripts/test-homebrew-formula.sh
          do
            echo "=== $suite"
            if ! "$suite"; then
              echo "=== $suite failed"
              status=1
            fi
          done
          exit "$status"

  clone-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark
    runs-on: ${{ inputs.runner != 'github' && 'namespace-profile-syq-macos' || 'macos-26' }}
    timeout-minutes: 30
    # Timing/resource failures must not invalidate release evidence. This job's
    # step result still records failure for anyone requesting benchmark results.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Attach Namespace Cargo cache
        if: inputs.runner != 'github'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
      - name: Show Namespace runner hardware
        if: inputs.runner != 'github'
        run: |
          sw_vers
          sysctl hw.model hw.ncpu hw.memsize machdep.cpu.brand_string
          df -h .
      - if: inputs.runner == 'github'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-macos-clone-benchmark-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-macos-clone-benchmark-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            cargo-macos-suite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            cargo-macos-clone-benchmark-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            cargo-macos-suite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            cargo-macos-clone-benchmark-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
            cargo-macos-suite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Cache pinned development tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/syq-tools
          key: dev-tools-${{ runner.os }}-${{ runner.arch }}-python-${{ hashFiles('scripts/dev-tools.lock', 'scripts/dev-tools.sh') }}
      - name: Install pinned development tools
        env:
          SYQ_TOOLS_DIR: ${{ runner.temp }}/syq-tools
        run: scripts/dev-tools.sh github python
      - name: Measure APFS cloning
        run: |
          cargo build --release --locked --bin syq
          python3 scripts/benchmark-macos-clone.py target/release/syq

  release-certification:
    needs: [scope, suite]
    if: needs.scope.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'The complete Apple Silicon native, SDK, and release-tool suites passed.'

  # Explicit evidence that this scheduled run did not execute validation.
  nightly-unchanged:
    needs: scope
    if: github.event_name == 'schedule' && needs.scope.outputs.needed == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Nightly test inputs are unchanged; reuse earlier certified evidence.'
