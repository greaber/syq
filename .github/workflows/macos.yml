name: Focused check
run-name: Focused check (${{ inputs.runner }}, ${{ inputs.provider }}) at ${{ inputs.revision || github.sha }}

# Deliberate, maintainer-dispatched shell code. No automatic triggers or release
# certification: success means only that the submitted script exited zero.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Operating system
        type: choice
        default: linux
        options: [linux, macos]
      provider:
        description: Runner provider
        type: choice
        default: namespace
        options: [namespace, github]
      script:
        description: Bash script to run (public; do not include secrets)
        type: string
        required: true
      revision:
        description: Exact commit to check out (defaults to workflow commit)
        type: string
      cargo_cache:
        description: Attach Cargo cache for Rust checks
        type: boolean
        default: false
      timeout:
        description: Timeout in minutes
        type: number
        default: 15

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ inputs.provider == 'namespace' && (inputs.runner == 'macos' && 'namespace-profile-syq-macos' || format('namespace-profile-syq-linux;github.run-id={0}', github.run_id)) || (inputs.runner == 'macos' && 'macos-26' || 'ubuntu-24.04') }}
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Attach Namespace Cargo cache
        if: inputs.cargo_cache && inputs.provider == 'namespace'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
      - name: Restore GitHub Cargo cache
        if: inputs.cargo_cache && inputs.provider == 'github'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: focused-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-${{ inputs.runner == 'macos' && 'macos-suite' || 'ci-rust' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
      - name: Run the selected check
        shell: bash
        env:
          CHECK_SCRIPT: ${{ inputs.script }}
        run: |
          echo "Checking $(git rev-parse HEAD) on $(uname -s)/$(uname -m)"
          test -n "$CHECK_SCRIPT"
          printf '%s\n' "$CHECK_SCRIPT" > "$RUNNER_TEMP/syq-focused-check.sh"
          bash --noprofile --norc -euo pipefail "$RUNNER_TEMP/syq-focused-check.sh"
