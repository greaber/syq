name: macOS suite

# The native test suite and clippy on macOS, with the Python SDK packaging and
# release tooling suites. Automated validation runs after merges to master and
# on demand, not on pull requests. Nightly runs, manual runs on master, and runs
# with `complete` run every step; other runs include SDK packaging and release
# tooling only when their changes affect them.
on:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      complete:
        description: Also run SDK packaging and release tooling on a task branch
        type: boolean
        default: false
      benchmark:
        description: Also run the independent APFS timing benchmark
        type: boolean
        default: false
      test_name:
        description: Exact Rust test name (empty runs the full suite)
        required: false
        type: string
      test_target:
        description: Cargo target for the exact test
        required: false
        default: syq
        type: choice
        options:
          - syq
          - local
          - help
          - output
          - update
          - tls
          - return_handoff
          - macos_exfat
          - s3

permissions:
  contents: read
  actions: read

# Maturin builds with this deployment target unless one is set, and C
# dependencies rebuild whenever it changes. Setting it for every build lets
# the tests, the wheel, and the cached dependencies share one build.
env:
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  focused-test:
    # scripts/branch-status.py identifies a check by its job name.
    name: focused-test (${{ inputs.test_target || 'syq' }}, ${{ inputs.test_name }})
    if: github.event_name == 'workflow_dispatch' && inputs.test_name != ''
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The suite's master runs save this entry.
      - name: Restore Cargo dependencies and build output
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/debug/incremental
          key: cargo-macos-suite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-macos-suite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Cache pinned development tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/syq-tools
          key: pinned-tools-${{ runner.os }}-${{ runner.arch }}-jq-python-nextest-${{ hashFiles('scripts/setup.lock', 'scripts/setup.sh') }}
      - name: Install pinned development tools
        env:
          SYQ_TOOLS_DIR: ${{ runner.temp }}/syq-tools
        run: scripts/setup.sh github jq python cargo-nextest
      - name: Run the exact test
        shell: bash
        env:
          TEST_NAME: ${{ inputs.test_name }}
          TEST_TARGET: ${{ inputs.test_target || 'syq' }}
        run: |
          # Inputs remain data; accept only ordinary Rust test identifiers.
          [[ "$TEST_NAME" =~ ^[a-zA-Z_][a-zA-Z0-9_:]*$ ]] || {
            echo 'Provide a fully qualified Rust test name.' >&2
            exit 2
          }
          case "$TEST_TARGET" in
            syq) target=(--bin syq) ;;
            local|help|output|update|tls|return_handoff|macos_exfat|s3)
              target=(--test "$TEST_TARGET") ;;
            *) echo "Unknown test target: $TEST_TARGET" >&2; exit 2 ;;
          esac
          # Nextest rejects a missing exact test and times out a hung one.
          cargo nextest run --locked "${target[@]}" --run-ignored all --no-tests fail -- --exact "$TEST_NAME"

  scope:
    if: github.event_name != 'workflow_dispatch' || inputs.test_name == ''
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.changes.outputs.needed }}
      sdk: ${{ steps.changes.outputs.sdk }}
      release_tooling: ${{ steps.changes.outputs.release_tooling }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cache pinned development tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/syq-tools
          key: pinned-tools-${{ runner.os }}-${{ runner.arch }}-jq-python-${{ hashFiles('scripts/setup.lock', 'scripts/setup.sh') }}
      - name: Install pinned development tools
        env:
          SYQ_TOOLS_DIR: ${{ runner.temp }}/syq-tools
        run: scripts/setup.sh github jq python
      - id: changes
        env:
          COMPLETE: ${{ inputs.complete }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          event=$GITHUB_EVENT_PATH
          task_branch=false
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/master ]]; then
            # Classify a task branch's changes as its pull request would be.
            task_branch=true
            event=$RUNNER_TEMP/branch-event.json
            printf '{"pull_request":{"base":{"sha":"%s"},"head":{"sha":"%s"}}}\n' \
              "$(git rev-parse origin/master)" "$(git rev-parse HEAD)" > "$event"
          fi
          scope=$(scripts/ci-scope.py "$event")
          # ci-scope output is a machine-readable key=value contract.
          value() { sed -n "s/^$1=//p" <<< "$scope"; }
          # Only explicit macOS changes select this platform after a merge.
          # Manual and changed-input nightly runs select the suite.
          needed=$(value macos)
          if [[ "$task_branch" == true ]]; then needed=true; fi
          all=false
          if [[ "$(value full_suite)" == true || "$COMPLETE" == true ]]; then all=true; fi
          sdk=$all
          if [[ "$(value python_sdk)" == true ]]; then sdk=true; fi
          release_tooling=$all
          checks=" $(value tooling_checks) "
          for check in release orchestration installer; do
            if [[ "$checks" == *" $check "* ]]; then release_tooling=true; fi
          done
          printf '%s\n' "needed=$needed" "sdk=$sdk" "release_tooling=$release_tooling" |
            tee -a "$GITHUB_OUTPUT"

  suite:
    # Cancel matching automatic checks and earlier manual runs on the same
    # task branch; manual runs on master keep a unique group.
    concurrency:
      group: ${{ github.workflow }}-suite-${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master')) && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master') }}
    needs: scope
    if: needs.scope.outputs.needed == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Cargo caches hold one entry per toolchain and dependency set. Only
      # master saves them, so task branches neither fill the repository's
      # cache budget nor replace master's entries.
      - name: Restore Cargo dependencies and build output
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/debug/incremental
          key: cargo-macos-suite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-macos-suite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Cache pinned development tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/syq-tools
          key: pinned-tools-${{ runner.os }}-${{ runner.arch }}-suite-${{ hashFiles('scripts/setup.lock', 'scripts/setup.sh') }}
      - name: Install pinned development tools
        env:
          SYQ_TOOLS_DIR: ${{ runner.temp }}/syq-tools
        run: scripts/setup.sh github jq uv python cargo-nextest
      - name: Show toolchain and environment
        run: |
          rustc --version
          cargo --version
          bash --version | head -1
          echo "TMPDIR=$TMPDIR"
      - run: rustup component add clippy
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Native tests
        run: cargo nextest run --locked --all-targets
      # These ignored tests need the runner's live network or root. Nightly and
      # manual suites run them; post-merge runs skip them.
      - name: Tests that need a live network or root
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          cargo nextest run --locked --bin syq --run-ignored only --no-tests fail -- \
            --exact tune::network::macos::tests::native_router_fingerprint
          # Reuse the compiled tests under sudo without running Cargo as root.
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
          cargo nextest list --locked --test local --list-type binaries-only \
            --message-format json > "$RUNNER_TEMP/binaries-metadata.json"
          for test in \
            macos_metadata::acl_restoration_failure_cannot_be_accepted_as_a_content_match \
            macos_metadata::acl_staging_stays_private_when_ownership_changes
          do
            sudo -n env PATH="$PATH" cargo-nextest nextest run \
              --cargo-metadata "$RUNNER_TEMP/cargo-metadata.json" \
              --binaries-metadata "$RUNNER_TEMP/binaries-metadata.json" \
              --run-ignored only --no-tests fail -- --exact "$test"
          done
      # Reuse the syq binary built for the integration tests. A plain `cargo
      # build` resolves dependency features without dev-dependencies and
      # would compile every dependency again.
      - name: Build the candidate syq executable
        run: cargo test --locked --all-targets --no-run
      - name: Use Homebrew OpenSSL for Ed25519 signing
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Test interactive benchmark with system Bash
        run: python3 tests/tooling/test-try-benchmark.py
      - name: Release tooling suites
        if: needs.scope.outputs.release_tooling == 'true'
        run: |
          status=0
          run() {
            echo "=== $*"
            if ! "$@"; then
              echo "=== $* failed"
              status=1
            fi
          }
          # Test the candidate built above instead of building syq again.
          run tests/tooling/test-release-tools.py --syq "$GITHUB_WORKSPACE/target/debug/syq"
          for suite in \
            tests/tooling/test-release-orchestration.py \
            tests/tooling/test-generated-sdk-post-merge-ci.py \
            tests/tooling/test-release-readiness.py \
            tests/tooling/test-release-timings.py \
            tests/tooling/test-find-release-build.py \
            tests/tooling/test-installer.py \
            scripts/test-homebrew-formula.py
          do
            run "$suite"
          done
          exit "$status"
      # Last, because it removes syq's own build output to rebuild it from the sdist.
      - name: Test and package Python SDK
        if: needs.scope.outputs.sdk == 'true'
        env:
          PYTHONPATH: sdk/python/src
          SYQ_CANDIDATE_EXECUTABLE: ${{ github.workspace }}/target/debug/syq
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/syq-sdk-python
          XDG_CACHE_HOME: ${{ runner.temp }}/syq-sdk-cache
        run: |
          SYQ_CANDIDATE_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          export SYQ_CANDIDATE_VERSION
          tests/tooling/test-python-sdk-release-tools.py
          uv run --project sdk/python --frozen python -m unittest discover -s sdk/python/tests
          export SOURCE_DATE_EPOCH RUSTUP_TOOLCHAIN
          RUSTUP_TOOLCHAIN=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          # Match release packaging by stripping macOS debug symbols.
          output=target/sdk-python-dist
          # Restored Cargo caches can contain distributions from an older SDK.
          rm -rf -- "$output"
          MATURIN_PEP517_ARGS="--profile dev --strip" uv run --project sdk/python --frozen python -m build sdk/python --sdist --wheel --outdir "$output"
          python scripts/normalize-python-sdist.py \
            --epoch "$SOURCE_DATE_EPOCH" "$output"/*.tar.gz
          set -- target/sdk-python-dist/syq-*-py3-none-*.whl
          test "$#" -eq 1 && test -f "$1"
          env -u PYTHONPATH uv run --isolated --python "$UV_PYTHON" \
            --with "$1" \
            python scripts/check-python-wheel.py --version "$SYQ_CANDIDATE_VERSION"
          rm -rf -- target/sdk-python-from-sdist
          # Archive mtimes can repeat across commits. Rebuild syq itself while
          # keeping dependencies outside the disposable extraction directory.
          cargo clean --package syq --target-dir "$GITHUB_WORKSPACE/target"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
            MATURIN_PEP517_ARGS="--profile dev --strip" uv build --wheel \
            target/sdk-python-dist/*.tar.gz --out-dir target/sdk-python-from-sdist
          set -- target/sdk-python-from-sdist/syq-*-py3-none-*.whl
          test "$#" -eq 1 && test -f "$1"
          env -u PYTHONPATH uv run --isolated --python "$UV_PYTHON" \
            --with "$1" \
            python scripts/check-python-wheel.py --version "$SYQ_CANDIDATE_VERSION"
      - name: Save Cargo dependencies and build output
        if: >-
          github.ref == 'refs/heads/master' &&
          steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/debug/incremental
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  clone-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark
    runs-on: macos-26
    timeout-minutes: 30
    # Timing/resource failures must not invalidate release evidence. This job's
    # step result still records failure for anyone requesting benchmark results.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore Cargo dependencies and build output
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/debug/incremental
          key: cargo-macos-clone-benchmark-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-macos-clone-benchmark-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
            cargo-macos-suite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Cache pinned development tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/syq-tools
          key: pinned-tools-${{ runner.os }}-${{ runner.arch }}-python-${{ hashFiles('scripts/setup.lock', 'scripts/setup.sh') }}
      - name: Install pinned development tools
        env:
          SYQ_TOOLS_DIR: ${{ runner.temp }}/syq-tools
        run: scripts/setup.sh github python
      - name: Measure APFS cloning
        run: |
          cargo build --release --locked --bin syq
          python3 scripts/benchmark-macos-clone.py target/release/syq
      - name: Save Cargo dependencies and build output
        if: >-
          github.ref == 'refs/heads/master' &&
          steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/debug/incremental
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # Only a run that executed every step certifies a release.
  release-certification:
    needs: [scope, suite]
    if: >-
      needs.scope.outputs.needed == 'true' &&
      needs.scope.outputs.sdk == 'true' &&
      needs.scope.outputs.release_tooling == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'The complete Apple Silicon native, SDK, and release-tool suites passed.'

  # Explicit evidence that this scheduled run did not execute validation.
  nightly-unchanged:
    needs: scope
    if: github.event_name == 'schedule' && needs.scope.outputs.needed == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Nightly test inputs are unchanged; reuse earlier certified evidence.'
