name: macOS suite

# The complete native and SDK test suites, clippy, and release shell suites on
# macOS. Pull-request CI defers this platform coverage; this cumulative run
# happens after every merge to master and on demand.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}

permissions:
  contents: read

jobs:
  suite:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain and environment
        run: |
          rustc --version
          cargo --version
          bash --version | head -1
          echo "TMPDIR=$TMPDIR"
      - run: rustup component add clippy
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Native tests
        run: cargo test --locked --all-targets --no-fail-fast
      - name: Build the candidate syq executable
        run: cargo build --locked --bin syq
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install pinned Python tooling
        run: python -m pip install --disable-pip-version-check --no-deps uv==0.11.6
      - name: Use Homebrew OpenSSL for Ed25519 signing
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Test and reproducibly package Python SDK
        env:
          PYTHONPATH: sdk/python/src
          SYQ_CANDIDATE_EXECUTABLE: ${{ github.workspace }}/target/debug/syq
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/syq-sdk-python
          XDG_CACHE_HOME: ${{ runner.temp }}/syq-sdk-cache
        run: |
          SYQ_CANDIDATE_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          export SYQ_CANDIDATE_VERSION
          scripts/test-python-sdk-release-tools.sh
          uv run --project sdk/python --frozen python -m unittest discover -s sdk/python/tests
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          for output in target/sdk-python-dist-a target/sdk-python-dist-b; do
            uv run --project sdk/python --frozen python -m build sdk/python --outdir "$output"
            python scripts/normalize-python-sdist.py \
              --epoch "$SOURCE_DATE_EPOCH" "$output"/*.tar.gz
            sleep 2
          done
          for artifact in target/sdk-python-dist-a/*; do
            name=${artifact##*/}
            cmp "$artifact" "target/sdk-python-dist-b/$name"
          done
          set -- target/sdk-python-dist-a/syq-*-py3-none-any.whl
          test "$#" -eq 1 && test -f "$1"
          env -u PYTHONPATH uv run --isolated --python 3.10 \
            --with "$1" \
            python -c 'import syq; assert syq.version() == syq.PINNED_SYQ_VERSION'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          package-manager-cache: false
      - name: Test and package JavaScript SDK
        working-directory: sdk/js
        run: |
          npm ci --ignore-scripts
          npm test
          npm pack --dry-run
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false
      - name: Format, vet, and test Go SDK
        working-directory: sdk/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: Release shell suites
        run: |
          status=0
          for suite in \
            scripts/test-release-tools.sh \
            scripts/test-release-orchestration.sh \
            scripts/test-secret-tools.sh \
            scripts/test-installer.sh \
            scripts/test-homebrew-formula.sh
          do
            echo "=== $suite"
            if ! "$suite"; then
              echo "=== $suite failed"
              status=1
            fi
          done
          exit "$status"
