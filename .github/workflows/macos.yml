name: Manual platform policy experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build release experiment
        run: cargo build --locked --release --bin syq
      - name: Measure and verify disposable copies
        run: python3 scripts/platform-policy-audit.py target/release/syq
