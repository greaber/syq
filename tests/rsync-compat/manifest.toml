area = "failure-isolation"
position = "compatible"
baseline = "pass"
platforms = ["linux"]
tags = ["local", "source-change", "partial-failure", "data-integrity"]
requirements = ["C compiler", "LD_PRELOAD", "/proc/self/fd"]
note = "An external shim deterministically shrinks a source at its first positioned read. The failure remains visible, preserves the existing destination, and allows a later file to transfer; rsync's exact exit code and diagnostic wording are not required."

