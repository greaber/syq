[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
unmaintained = "workspace"
yanked = "warn"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa never decrypts in syq; it signs only grants from the user's own unencrypted RSA login key file on their machine (agent-held keys are signed by the agent), so the timing side channel would need local measurement by someone who could already read that file; no fixed rsa release exists" },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 (via ssh-key's p256/p384/p521) does private-key work only when syq signs grants from the user's own unencrypted ECDSA login key file on their machine; verification uses public data. Revisit when ssh-key 0.7 (crypto-bigint >= 0.7.6) is released" },
]

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = [
  { crate = "syn@2.0.119", reason = "curve25519-dalek-derive has not moved to syn 3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
