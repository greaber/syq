[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
unmaintained = "workspace"
yanked = "warn"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa is used only to parse SSH public credentials and verify signatures; syq never performs the vulnerable RSA private-key decryption or signing operations" },
]

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = [
  { crate = "syn@2.0.119", reason = "curve25519-dalek-derive has not moved to syn 3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
