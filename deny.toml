[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
unmaintained = "workspace"
yanked = "warn"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "Accepted residual risk: rsa never decrypts in syq, but it signs grants in-process with the user's unencrypted RSA login key file on the enrolling machine (agent-held keys sign in the agent; verification uses public data). Exploiting the timing side channel needs precise timing of those local signing operations. No fixed rsa release exists" },
  { id = "RUSTSEC-2026-0387", reason = "Accepted residual risk: crypto-bigint 0.5 (via ssh-key's p256/p384/p521) runs private-key arithmetic in-process on the enrolling machine when syq signs grants with an unencrypted ECDSA login key file and when it generates an ECDSA entry key at enrollment (agent-held keys sign in the agent; verification uses public data). Exploiting it needs precise timing of those local operations. Drop this when ssh-key 0.7 (crypto-bigint >= 0.7.6) is released" },
]

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = [
  { crate = "syn@2.0.119", reason = "curve25519-dalek-derive has not moved to syn 3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
